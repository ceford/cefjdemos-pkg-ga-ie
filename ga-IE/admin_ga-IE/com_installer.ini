COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTSETDESC="Is é seo an fillteán ina gcóipeálann Joomla síneadh, ina ndéanann sé an síneadh a eastóscadh agus ansin cóipeáiltear na comhaid isteach sna eolairí cearta. Mura bhfuil an suíomh seo socraithe i configuration.php ($tmp_path) ní bheidh tú in ann síntí a uaslódáil. Cruthaigh fillteán chun Joomla a chumasú scríobh chuig an bhfillteán chun an fhadhb a réiteach."
COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTWRITEABLE="Níl an fillteán sealadach Joomla in-scríofa nó níl sé ann."
COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTWRITEABLEDESC="D’fhéadfadh sé seo fadhbanna a chruthú nuair a bhíonn tú ag iarraidh síntí a uaslódáil chuig Joomla. Má tá fadhbanna agat síntí a uaslódáil, déan cinnte go bhfuil an fillteán atá sainithe i do configuration.php ann nó seiceáil an '%s' agus socraigh é chun a bheith in-scríofa agus féach an réitíonn sé seo an fhadhb."
