COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTSETDESC="Is é seo an fillteán a úsáideann PHP chun comhad uaslódáilte a stóráil sula féidir le Joomla rochtain a fháil ar an gcomhad seo. Cé nach bhfuil an fillteán socraithe ní fadhb i gcónaí é, má tá fadhbanna agat le comhaid léarscáile nach bhfuil á n-aithint nó comhaid uaslódáilte nach bhfuil á n-aithint, d’fhéadfadh socrú seo i do chomhad php.ini an fhadhb a réiteach."
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTWRITEABLE="Níl an fillteán sealadach PHP in-scríofa."
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTWRITEABLEDESC="Níl an fillteán seo in-scríofa ag an eiseamláir Joomla!, rud a d’fhéadfadh fadhbanna a chruthú nuair a bhíonn tú ag iarraidh síntí a uaslódáil chuig Joomla. Má tá fadhbanna agat síntí a uaslódáil, seiceáil an '%s' agus socraigh é chun a bheith in-scríofa agus féach an réitíonn sé seo an fhadhb."
COM_INSTALLER_MSG_WARNINGS_SMALLPOSTSIZE="Méid uasta POST PHP ró-bheag."
COM_INSTALLER_MSG_WARNINGS_SMALLPOSTSIZEDESC="Is é seo an méid uasta sonraí is féidir a sheoladh trí POST chuig an bhfreastalaí. Áirítear leis seo aighneachtaí foirme d’altanna, meáin (íomhánna, físeáin) agus síntí. Tá an luach seo níos lú ná 16MB, rud a d’fhéadfadh tionchar a imirt ar uaslódáil síntí móra. Tá sé seo socraithe sa php.ini faoi post_max_size."
COM_INSTALLER_MSG_WARNINGS_SMALLUPLOADSIZE="Tá an méid uasta uaslódála comhad PHP ró-bheag."
COM_INSTALLER_MSG_WARNINGS_SMALLUPLOADSIZEDESC="Tá an méid comhaid uasta le haghaidh uaslódála socraithe go dtí níos lú ná 16MB, rud a d'fhéadfadh tionchar a imirt ar uaslódáil síntí móra. Tá sé seo socraithe i php.ini i socruithe upload_max_filesize agus post_max_size de do shocruithe PHP (atá suite i gcomhad php.ini agus/nó .htaccess). Caithfidh luach post_max_size a bheith níos mó ná luach upload_max_filesize."
COM_INSTALLER_MSG_WARNINGS_UPDATE_NOTICE="Sula ndéanann tú nuashonrú, cinntigh go bhfuil an nuashonrú comhoiriúnach le do shuiteáil Joomla! <br>Moltar go láidir duit cúltaca a dhéanamh de chomhaid agus de bhunachar sonraí do shuíomh sula dtosaíonn tú ag nuashonrú."
COM_INSTALLER_MSG_WARNINGS_UPLOADBIGGERTHANPOST="Méid Uaslódála PHP níos mó ná méid POST."
COM_INSTALLER_MSG_WARNINGS_UPLOADBIGGERTHANPOSTDESC="Tá luach an upload_max_filesize sa chomhad php.ini níos mó ná an athróg post_max_size. Tógfaidh an athróg post_max_size tosaíocht agus cuirfidh sé bac ar iarratais níos mó ná é. Is míshocrú freastalaí é seo go ginearálta nuair a bhíonn iarracht á déanamh méideanna uaslódála a mhéadú. Le do thoil, méadaigh luach post_max_size chun a bheith níos mó ná luach upload_max_filesize."
COM_INSTALLER_MSG_WARNINGS_UPLOADFILETOOBIG="Ní féidir an comhad roghnaithe a uaslódáil mar tá sé níos mó ná an méid uaslódála uasta."
