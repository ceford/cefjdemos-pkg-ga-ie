COM_INSTALLER_MSG_WARNINGS_NOTCOMPLETE="<h1>Rabhadh: Nuashonrú Neamhchríochnaithe!</h1><p>Níl an nuashonrú ach páirteach. Déan an dara nuashonrú le do thoil chun an próiseas a chríochnú.</p>"
