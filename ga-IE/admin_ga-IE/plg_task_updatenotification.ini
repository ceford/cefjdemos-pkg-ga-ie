PLG_TASK_UPDATENOTIFICATION="Tasc - Fógra Nuashonraithe Joomla!"
PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="Liosta de sheoltaí ríomhphoist atá scartha le camóg a gheobhaidh na ríomhphoist fógra nuashonraithe. Caithfidh na seoltaí sa liosta a bheith ag úsáideoirí atá ann cheana ar do shuíomh a bhfuil an phribhléid Super User acu. Mura mbaineann aon cheann de na ríomhphoist liostaithe le Super Users, nó má fhágtar bán é, gheobhaidh gach Super User ar an suíomh seo an ríomhphost fógra nuashonraithe."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="Ríomhphoist Super User"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Fógra Nuashonraithe Joomla!"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="Seiceálann an tasc seo go tréimhsiúil le haghaidh leaganacha nua de Joomla! Nuair a aimsítear ceann, seolfar ríomhphost chugat, ag meabhrú duit nuashonrú a dhéanamh. Is féidir leat an ríomhphost a shaincheapadh ag Córas &rarr; Teimpléid Ríomhphoist."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="Roghnaigh teanga le haghaidh na ríomhphoist fógra nuashonraithe. Socraigh go Auto chun iad a sheoladh i dteanga an tsuímh ag an am."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="Teanga Ríomhphoist"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="Auto"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="NÍ SHEOLANN an ríomhphost seo ag tionscadal Joomla! Seoltar é go huathoibríoch ag do shuíomh féin,\n{SITENAME} - {URL} \n\n================================================================================\nEOLAS NUASHONRÚCHÁIN\n================================================================================\n\nTá do shuíomh tar éis a fháil amach go bhfuil leagan nuashonraithe de Joomla! ar fáil.\n\nLeagan Joomla! atá suiteáilte faoi láthair: {CURVERSION}\nLeagan Joomla! ar fáil le suiteáil: {NEWVERSION}\n\nSeoltar an ríomhphost seo chugat ag do shuíomh chun meabhrú duit faoin bhfíric seo.\nNí dhéanfaidh tionscadal Joomla! teagmháil dhíreach leat riamh faoi nuashonruithe ar fáil de Joomla! ar do shuíomh.\n\n================================================================================\nTREORACHA NUASHONRÚCHÁIN\n================================================================================\n\nChun an nuashonrú a shuiteáil ar {SITENAME} roghnaigh an nasc seo a leanas le do thoil. (Mura nasc é an URL, cóipeáil & greamaigh é chuig do bhrabhsálaí).\n\nNasc Nuashonraithe: {LINK}\n\nIs féidir nuacht an eisiúna a fháil anseo: {RELEASENEWS}\n\n================================================================================\nCÉN FÁTH A BHFUIL AN RÍOMHPHOST SEO Á FHÁIL AGAM?\n================================================================================\n\nSeoladh an ríomhphost seo go huathoibríoch ag breiseán a sholáthraíonn Joomla!, an bogearra a chumhachtaíonn do shuíomh.\nLorgaíonn an breiseán seo leaganacha nuashonraithe de Joomla! agus seolann sé fógra ríomhphoist chuig a riarthóirí.\nGheobhaidh tú roinnt ríomhphoist den chineál céanna ó do shuíomh go dtí go ndéanfaidh tú an bogearra a nuashonrú nó go ndíchumasaíonn tú na ríomhphoist seo.\n\nChun na ríomhphoist seo a dhíchumasú, dífhoilsigh an breiseán 'Tasc - Fógra Nuashonraithe Joomla!' sa Bhainisteoir Breiseán ar do shuíomh.\n\nMura dtuigeann tú cad is Joomla! ann agus cad is gá duit a dhéanamh, ná déan teagmháil le tionscadal Joomla! le do thoil.\nNÍL siad ag seoladh an ríomhphoist seo chugat agus ní féidir leo cabhrú leat. Ina áit sin, déan teagmháil leis an duine a thóg nó a bhainistíonn do shuíomh.\n\nMá tá tú ar an duine a thóg nó a bhainistíonn do shuíomh gréasáin, tabhair faoi deara go bhféadfadh an breiseán seo a bheith gníomhachtaithe go huathoibríoch nuair a shuiteáil nó a nuashonraigh tú Joomla! ar do shuíomh.\n\n================================================================================\nCÉ A SHEOL AN RÍOMHPHOST SEO CHUGAM?\n================================================================================\n\nSeoltar an ríomhphost seo chugat ag do shuíomh féin, {SITENAME}"
; You can use the following merge codes:
; {NEWVERSION}		New Joomla! version, e.g. 1.2.3
; {CURVERSION}		Currently installed Joomla! version, e.g. 1.2.0
; {SITENAME}		Site name, as set in Global Configuration.
; {URL}			URL of the site's frontend page.
; {LINK}		Update URL (link to com_joomlaupdate, will request login if the Super User isn't already logged in).
; {RELEASENEWS}		URL to the release news on joomla.org
; \n			Newline character. Use it to start a new line in the email.
