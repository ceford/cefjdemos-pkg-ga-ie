PLG_QUICKICON_EOS_MESSAGE_ERROR_SUPPORT_ENDED="<p>Tá tacaíocht do do leagan de Joomla 5 críochnaithe. <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">Déan uasghrádú go Joomla 6</a> chomh luath agus is féidir.</p>"
PLG_QUICKICON_EOS_MESSAGE_INFO_01="<p>Tá Joomla 6 tagtha! Faigh amach gach rud atá le tairiscint ag Joomla 6 duit. Seiceáil an leathanach tuirlingthe le haghaidh <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">gnéithe agus feabhsuithe Joomla 6</a>.</p>"
PLG_QUICKICON_EOS_MESSAGE_INFO_02="<p>Cathain is ceart uasghrádú go Joomla 6? Nuair a bheidh na síntí a theastaíonn ó do shuíomh comhoiriúnach. Foghlaim <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\"> conas an Seiceálaí Réamh-Uasghrádaithe a úsáid</a>.</p>"
PLG_QUICKICON_EOS_MESSAGE_WARNING_SECURITY_ONLY="<p>Tá Joomla 5 tar éis dul isteach i mód slándála amháin. Críochnaíonn tacaíocht %1$s. Tosaigh <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">ag pleanáil chun uasghrádú</a> go Joomla 6 inniu.</p>"
PLG_QUICKICON_EOS_MESSAGE_WARNING_SUPPORT_ENDING="<p>Críochnaíonn tacaíocht ar %1$s do Joomla 5 <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">Déan uasghrádú go Joomla 6</a> chomh luath agus is féidir.</p>"
