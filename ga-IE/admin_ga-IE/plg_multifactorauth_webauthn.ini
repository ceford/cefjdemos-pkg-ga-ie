PLG_MULTIFACTORAUTH_WEBAUTHN="Fíordheimhniú Ilfhachtóra - Eochracha Pas"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Iarratas fíordheimhnithe neamhbhailí."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_PK="Theip ar chlárú an eochair pas. Ní hionann an freagra eochair pas a fuarthas ón mbrabhsálaí agus an Eochair Phoiblí a d'eisigh an freastalaí. Ciallaíonn sé seo gur iarracht duine éigin tú a hackáil nó go bhfuil rud éigin briste."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_USER="Ar chúiseanna slándála níl cead agat eochracha pas a chlárú thar ceann úsáideora eile."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Chuaigh rud éigin mícheart ach níl tuilleadh faisnéise faoin earráid ar fáil ag an am seo. Déan iarracht do eochair pas a chlárú arís le do thoil."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_PK="Níor eisigh an freastalaí Eochair Phoiblí le haghaidh clárú eochair pas ach ar bhealach éigin fuair sé iarratas clárúcháin eochair pas ón mbrabhsálaí. Ciallaíonn sé seo gur iarracht duine éigin tú a hackáil nó go bhfuil rud éigin briste."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTAVAILABLE_BODY="Níl tacaíocht ag do bhrabhsálaí don chaighdeán eochair pas. Níl gach brabhsálaí comhoiriúnach le heochracha pas ar gach gléas fós."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTAVAILABLE_HEAD="Níl tacaíocht ag do bhrabhsálaí d'eochracha pas"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTHTTPS_BODY="Téigh chuig an suíomh thar HTTPS le Fíordheimhniú Ilfhachtóra a chumasú le heochracha pas."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTHTTPS_HEAD="Tá eochracha pas ar fáil ar HTTPS amháin"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NO_STORED_CREDENTIAL="Níl eochair pas cumraithe agat fós nó níl an eochair pas atá tú ag iarraidh a úsáid incháilithe."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_CONFIGURED="Tá do eochair pas cumraithe agat cheana féin. Tabhair faoi deara nach féidir leat ach a theideal a mhodhnú ón leathanach seo."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_DISPLAYEDAS="Eochair Pas"
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_INSTRUCTIONS="Úsáid an cnaipe &ldquo;%s&rdquo; ar an leathanach seo chun tús a chur leis an bpróiseas Fíordheimhnithe Gréasáin. Lean na treoracha a thugann do bhrabhsálaí duit chun Fíordheimhniú Gréasáin a chríochnú le do eochair pas roghnaithe."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_REGISTERKEY="Cláraigh do eochair pas"
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_SHORTINFO="Úsáid eochracha pas brabhsálaí le haon eochair slándála crua-earraí nó bogearraí."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_VALIDATEKEY="Bailigh le do eochair pas"
PLG_MULTIFACTORAUTH_WEBAUTHN_XML_DESCRIPTION="Úsáid eochracha pas brabhsálaí mar mhodh Fíordheimhniú Ilfhachtóra. Tacaíonn gach brabhsálaí nua-aimseartha leis. Tairgeann an chuid is mó de bhrabhsálaithe fíordheimhniú sonrach don ghléas atá cosanta ag pasfhocal agus/nó bithmhéadracht (braiteoir méarloirg, scanadh aghaidhe, &hellip;)."
