COM_PRIVACY_POSTINSTALL_BODY="<p>Le tabhairt isteach GDPR do shaoránaigh an AE agus rialacháin chosúla in áiteanna eile ar domhan, b'fhéidir go mbeidh gá agat toiliú a iarraidh sula stórálann tú aon <strong>Faisnéis Phearsanta</strong> úsáideora.</p><p>Cuireann Joomla 3.9 cumais nua ar fáil chun cabhrú leat polasaithe príobháideachta láithreáin a chruthú agus toiliú úsáideora a bhailiú. Ina theannta sin, tá sreabhadh oibre ar fáil chun cabhrú leat iarratais faisnéise úsáideora a bhainistiú, mar shampla iarratais chun a gcuid sonraí pearsanta a bhaint as do shuíomh.</p><p>Le haghaidh tuilleadh faisnéise faoin ngné nua seo, léigh an <a href='https://docs.joomla.org/Special:MyLanguage/J3.x:Privacy' target='_blank' rel='noopener noreferrer'>doiciméadú Príobháideachta</a>.</p>"
