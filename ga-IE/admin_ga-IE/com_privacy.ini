COM_PRIVACY_CORE_CAPABILITY_COMMUNICATION_WITH_JOOMLA_ORG="Nuair a bhíonn nasc líonra ar fáil, déanfaidh suiteáil Joomla iarracht cumarsáid a dhéanamh le freastalaithe joomla.org do chumais éagsúla, lena n-áirítear:<ul><li>Seiceáil le haghaidh nuashonruithe don fheidhmchlár Joomla</li><li>Scáileáin chabhrach do shíneadh croí Joomla</li><li>An tseirbhís Suiteáil ón nGréasán (roghnach)</li><li>An freastalaí bailithe staitisticí (roghnach)</li></ul>Mar a bhíonn le gach iarratas HTTP, seolfar seoladh IP do fhreastalaí mar chuid den iarratas. Le haghaidh faisnéise ar conas a phróiseálann Joomla sonraí ar a fhreastalaithe, féach ar ár <a href=\"https://www.joomla.org/privacy-policy.html\" target=\"_blank\" rel=\"noopener noreferrer\">bpolasaí príobháideachais</a>."
COM_PRIVACY_CORE_CAPABILITY_LOGGING_IP_ADDRESS="Taifeadann córas logála Joomla seoladh IP an chuairteora a fhágann go scríobhtar teachtaireacht chuig a chomhaid logála. Úsáidtear na comhaid logála seo chun gníomhaíocht éagsúla ar shuíomh Joomla a thaifeadadh, lena n-áirítear faisnéis a bhaineann le nuashonruithe croí, iarrachtaí logála isteach neamhbhailí, earráidí neamhbhainistithe, agus faisnéis forbartha mar úsáid APIanna atá as dáta. Is féidir formáid na gcomhad logála seo a shaincheapadh ag aon síneadh a chumraíonn logálaí, mar sin moltar duit na comhaid logála do do shuíomh gréasáin a íoslódáil agus a athbhreithniú a d'fhéadfadh a bheith le fáil ag `%s`."
COM_PRIVACY_CORE_CAPABILITY_SESSION_IP_ADDRESS_AND_COOKIE="Tosaíonn gach iarratas chuig suíomh gréasáin Joomla seisiún a stórálann an seoladh IP sna sonraí seisiúin agus a chruthaíonn fianán seisiúin i mbrabhsálaí an úsáideora. Úsáidtear an seoladh IP mar bheart slándála chun cabhrú le cosaint i gcoinne ionsaithe greamaithe seisiúin féideartha agus scriostar an fhaisnéis seo nuair a bhíonn an seisiún imithe in éag agus a shonraí glanta. Tá ainm an fhianáin seisiúin bunaithe ar hash a ghintear go randamach agus mar sin níl aitheantóir seasta aige. Scriostar an fianán seisiúin nuair a bhíonn an seisiún imithe in éag nó nuair a bhíonn an t-úsáideoir tar éis a mbrabhsálaí a fhágáil."
