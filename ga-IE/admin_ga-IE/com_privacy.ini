COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_EXPORT_REQUEST="Tá riarachán do {URL} tar éis iarratas a chruthú chun faisnéis phearsanta a easpórtáil a bhaineann leis an seoladh ríomhphoist seo. Mar bheart slándála, ní mór duit a dhearbhú gur iarratas bailí é seo ar do chuid faisnéise pearsanta ón suíomh Gréasáin seo.\n\nMá bhí sé seo ina bhotún, déan neamhaird ar an ríomhphost seo agus ní tharlóidh aon rud.\n\nChun an t-iarratas seo a dhearbhú, is féidir leat ceann de na tascanna seo a leanas a chomhlánú:\n\n1. Tabhair cuairt ar an URL seo a leanas: {TOKENURL}\n\n2. Cóipeáil do thicéad ón ríomhphost seo, tabhair cuairt ar an URL tagartha, agus greamaigh do thicéad isteach sa fhoirm.\nURL: {FORMURL}\nTicéad: {TOKEN}\n\nTabhair faoi deara nach bhfuil an ticéad seo bailí ach ar feadh 24 uair an chloig ón am a seoladh an ríomhphost seo."
COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_REMOVE_REQUEST="Tá riarachán do {URL} tar éis iarratas a chruthú chun gach faisnéis phearsanta a bhaineann leis an seoladh ríomhphoist seo a bhaint. Mar bheart slándála, ní mór duit a dhearbhú gur iarratas bailí é seo chun do chuid faisnéise pearsanta a bhaint ón suíomh Gréasáin seo.\n\nMá bhí sé seo ina bhotún, déan neamhaird ar an ríomhphost seo agus ní tharlóidh aon rud.\n\nChun an t-iarratas seo a dhearbhú, is féidir leat ceann de na tascanna seo a leanas a chomhlánú:\n\n1. Tabhair cuairt ar an URL seo a leanas: {TOKENURL}\n\n2. Cóipeáil do thicéad ón ríomhphost seo, tabhair cuairt ar an URL tagartha, agus greamaigh do thicéad isteach sa fhoirm.\nURL: {FORMURL}\nTicéad: {TOKEN}\n\nTabhair faoi deara nach bhfuil an ticéad seo bailí ach ar feadh 24 uair an chloig ón am a seoladh an ríomhphost seo."
