COM_PRIVACY_MSG_CAPABILITIES_INTRODUCTION="Bailítear an fhaisnéis ar an scáileán seo ó fhorlíontáin a thuairiscíonn a gcumas a bhaineann le príobháideacht don chóras seo. Tá sé beartaithe chun cabhrú le húinéirí láithreán a bheith ar an eolas faoi chumas na bhforlíontán suiteáilte agus faisnéis a sholáthar chun cabhrú le húinéirí polasaithe láithreán áitiúla a chruthú mar bheartas príobháideachta. Ós rud é go dteastaíonn tacaíocht ó fhorlíontáin don chóras tuairiscithe seo, agus nach dtaispeánann sé ach faisnéis ó fhorlíontáin chumasaithe, níor cheart é seo a mheas mar liosta iomlán agus moltar duit dul i gcomhairle le doiciméadú gach forlíontáin le haghaidh tuilleadh faisnéise."
