COM_USERS_POSTINSTALL_MULTIFACTORAUTH_ACTION="Cumasaigh na breiseáin nua Fíordheimhnithe Ilfhachtóra"
COM_USERS_POSTINSTALL_MULTIFACTORAUTH_BODY="<p>Tagann Joomla! le taithí <a href=\"https://en.wikipedia.org/wiki/Multi-factor_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">Fíordheimhnithe Ilfhachtóra</a> feabhsaithe go mór chun cabhrú leat logálacha d'úsáideoirí a dhaingniú.</p><p>Murab ionann agus an ghné Fíordheimhnithe Dhá Fhachtóir i leaganacha roimhe seo de Joomla, ní gá d'úsáideoirí <em>cód slándála a iontráil lena n-ainm úsáideora agus a bpasfhocal</em> a thuilleadh. Tarlaíonn an Fíordheimhniú Ilfhachtóra i gcéim ar leith tar éis logáil isteach ar an suíomh. Go dtí go gcríochnaíonn siad a bhfíordheimhniú Ilfhachtóra ní féidir le húsáideoirí nascleanúint a dhéanamh chuig leathanaigh eile nó an suíomh a úsáid. Déanann sé seo an Fíordheimhniú Ilfhachtóra <a href=\"https://en.wikipedia.org/wiki/Phishing\" target=\"_blank\" rel=\"noopener noreferrer\">frith-phishing</a>. Ligeann sé freisin do mhodhanna fíordheimhnithe idirghníomhacha cosúil le heochracha pas (lena n-áirítear comhtháthú le Windows Hello, Apple TouchID / FaceID agus Glas Scáileáin Bithmhéadrach Android), nó cóid fíordheimhnithe 6 dhigit a sheoladh trí ríomhphost. Tá an dá mhodh idirghníomhach, áisiúil seo ar fáil anois mar bhreiseáin a sheoltar le Joomla! féin.</p>"
