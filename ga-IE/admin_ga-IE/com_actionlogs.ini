COM_ACTIONLOGS_POSTINSTALL_BODY="<p>Le scaoileadh Joomla 3.9.0 is féidir leat anois gach gníomh riaracháin a rinne d'úsáideoirí a logáil sna síntí tacaíochta. Tá sé éasca anois a fheiceáil cé a rinne cad agus cathain a rinne siad é.</p><p>Is féidir na logaí a athbhreithniú i Joomla nó a easpórtáil le haghaidh úsáide seachtracha.</p><p>Le haghaidh tuilleadh eolais ar an ngné nua seo léigh an <a href='https://docs.joomla.org/Special:MyLanguage/J3.x:User_Action_Logs' target='_blank' rel='noopener noreferrer'>doiciméadacht Logaí Gníomh Úsáideora.</a></p>"
