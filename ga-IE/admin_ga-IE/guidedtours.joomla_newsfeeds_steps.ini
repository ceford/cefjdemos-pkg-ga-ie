COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_NEW_TITLE="Roghnaigh an cnaipe 'Nua'"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_NEW_DESCRIPTION="Roghnaigh 'Nua' chun fotha nuachta nua a chruthú."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_TITLE_TITLE="Cuir teideal leis"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_TITLE_DESCRIPTION="Cuir isteach teideal riachtanach don fhotha nuachta."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_ALIAS_TITLE="Cuir isteach ailias"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_ALIAS_DESCRIPTION="Is féidir leat ainm inmheánach an fhotha nuachta seo a scríobh. Is féidir leat é seo a fhágáil bán agus úsáidfear luach réamhshocraithe i litreacha beaga le fleiscíní in ionad spásanna mar chuid den URL."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_LINK_TITLE="Cuir isteach an nasc"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_LINK_DESCRIPTION="Cuir an nasc leis an bhfotha nuachta anseo."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_DESCRIPTION_TITLE="Cuir isteach cur síos"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_DESCRIPTION_DESCRIPTION="Cuir cur síos leis don fhotha nuachta san eagarthóir."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_STATUS_TITLE="Roghnaigh an stádas"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_STATUS_DESCRIPTION="Roghnaigh stádas foilsithe an fhotha nuachta."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_CATEGORY_TITLE="Roghnaigh catagóir"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_CATEGORY_DESCRIPTION="Roghnaigh an chatagóir don fhotha nuachta seo. Is féidir leat catagóir nua a chur isteach freisin trí ainm a chlóscríobh sa réimse agus brúigh isteach."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_ACCESS_TITLE="Socraigh an leibhéal rochtana"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_ACCESS_DESCRIPTION="Roghnaigh an leibhéal rochtana don fhotha nuachta."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_TAGS_TITLE="Cuir clibeanna leis"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_TAGS_DESCRIPTION="Roghnaigh clibeanna do do fhotha nuachta. Is féidir leat clib nua a chur isteach freisin trí ainm a chlóscríobh sa réimse agus brúigh isteach."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_VERSIONNOTE_TITLE="Cuir nóta leagan leis"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_VERSIONNOTE_DESCRIPTION="Is réimse roghnach é seo chun leagan an fhotha nuachta seo a aithint."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_SAVECLOSE_TITLE="Roghnaigh 'Sábháil agus Dún'"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_SAVECLOSE_DESCRIPTION="Sábháil agus dún an fotha nuachta."

COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_CONGRATULATIONS_TITLE="Comhghairdeas!"
COM_GUIDEDTOURS_TOUR_NEWSFEEDS_STEP_CONGRATULATIONS_DESCRIPTION="Tá fotha nuachta cruthaithe agat."
