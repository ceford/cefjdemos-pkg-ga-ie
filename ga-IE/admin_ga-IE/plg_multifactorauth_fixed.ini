PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE="<p class=\"alert alert-info\">Is féidir na teachtaireachtaí atá le feiceáil os cionn agus faoi bhun an limistéir chód a shaincheapadh trí na teaghráin teanga <code>PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE</code> agus <code>PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE</code> a shárú.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE="<p>Is breiseán taispeána Fíordheimhniú Ilfhachtóra é seo do Joomla. Ní mór duit an cód seasta a chumraigh tú a chur isteach nuair a chuir tú an Fíordheimhniú Ilfhachtóra ar chumas an úsáideora seo. Oibríonn sé go héifeachtach mar dhara pasfhocal.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_POSTMESSAGE="<p class=\"alert alert-info\">Is féidir na teachtaireachtaí atá le feiceáil os cionn agus faoi bhun an limistéir socraithe a shaincheapadh trí na teaghráin teanga <code>PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_PREMESSAGE</code> agus <code>PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_POSTMESSAGE</code> a shárú</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_PREMESSAGE="<p>Cuir isteach Cód Seasta thíos. Beidh ort an Cód Seasta seo a chur isteach tar éis logáil isteach sula mbeidh tú in ann an suíomh a úsáid.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SHORTINFO="Roghnaigh do chód réamhshocraithe féin. <strong>Chun críocha taispeána amháin</strong>."
PLG_MULTIFACTORAUTH_FIXED_XML_DESCRIPTION="Breiseán taispeána Fíordheimhniú Ilfhachtóra ag úsáid cód seasta (a &ldquo;dhara pasfhocal&rdquo;). <strong>Ná húsáid ar shuíomhanna beo, níl sé slán.</strong> Níl an breiseán seo i gceist ach mar shampla do fhorbróirí ar spéis leo a gcuid breiseán féin a chruthú."
