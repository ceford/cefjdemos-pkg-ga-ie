COM_CPANEL_MSG_ADDNOSNIFF_BODY="<p>Tá Joomla anois á sheachadadh le harduithe slándála breise sna comhaid réamhshocraithe htaccess.txt agus web.config.txt. Cuireann na harduithe seo an ghné ar a dtugtar sniffáil MIME-type i mbrabhsálaithe gréasáin as feidhm. Mar thoradh ar an sniffáil bíonn veicteoirí ionsaithe ar leith, áit a ndéantar scripteanna i bhformáidí comhaid nach bhfuil díobhálach de ghnáth (m.sh. íomhánna) a fhorghníomhú, rud a fhágann leochaileachtaí Cross-Site-Scripting.</p><p>Molta ag an bhfoireann slándála na hathruithe riachtanacha a chur i bhfeidhm de láimh ar chomhaid .htaccess nó web.config atá ann cheana, mar ní féidir na comhaid sin a nuashonrú go huathoibríoch.</p><p><strong>Athruithe do .htaccess</strong><br>Cuir na línte seo a leanas roimh \"## Mod_rewrite in use.\":</p><pre>&lt;IfModule mod_headers.c&gt;\nHeader always set X-Content-Type-Options \"nosniff\"\n&lt;/IfModule&gt;</pre><p><strong>Athruithe do web.config</strong><br>Cuir na línte seo a leanas díreach tar éis \"&lt;/rewrite&gt;\":</p><pre>&lt;httpProtocol&gt;\n  &lt;customHeaders&gt;\n    &lt;add name=\"X-Content-Type-Options\" value=\"nosniff\" /&gt;\n  &lt;/customHeaders&gt;\n&lt;/httpProtocol&gt;</pre>"
COM_CPANEL_MSG_ADDNOSNIFF_TITLE="Nuashonrú Slándála .htaccess & web.config"
COM_CPANEL_MSG_HTACCESSSVG_BODY="<p>Ó Joomla 3.9.21 tá riail slándála breise á seachadadh sa htaccess.txt réamhshocraithe. Cosnóidh an riail seo úsáideoirí comhaid svg ó leochaileachtaí féideartha Cross-Site-Scripting (XSS).<br>Molta ag an bhfoireann slándála na hathruithe riachtanacha a chur i bhfeidhm de láimh ar aon chomhad .htaccess atá ann cheana, mar ní féidir an comhad seo a nuashonrú go huathoibríoch.</p><p><strong>Athruithe do .htaccess</strong></p><pre>&lt;FilesMatch \"\.svg$\"&gt;\n  &lt;IfModule mod_headers.c&gt;\n    Header always set Content-Security-Policy \"script-src 'none'\"\n  &lt;/IfModule&gt;\n&lt;/FilesMatch&gt;</pre><p>Faoi láthair níl a fhios againn faoi mhodh chun é seo a chumrú go coinníollach ar fhreastalaithe gréasáin IIS, déan teagmháil le do sholáthraí óstála le haghaidh tuilleadh cúnamh.</p>"
COM_CPANEL_MSG_HTACCESSSVG_TITLE="Cosaint XSS breise don úsáid comhaid SVG"
COM_CPANEL_MSG_LANGUAGEACCESS340_BODY="Ó Joomla! 3.4.0 d'fhéadfadh go mbeadh fadhbanna agat leis an mbreiseán Córas - Scagaire Teanga ar do shuíomh gréasáin. Chun iad a réiteach oscail an <a href=\"index.php?option=com_languages&view=languages\">Bainisteoir Teangacha</a> agus sábháil gach teanga ábhair de láimh chun a chinntiú go bhfuil leibhéal Rochtana sábháilte."
COM_CPANEL_MSG_LANGUAGEACCESS340_TITLE="D'fhéadfadh fadhbanna a bheith agat le do shocruithe ilteangacha"
COM_CPANEL_MSG_ROBOTS_BODY="Rinneadh athrú ar na comhaid réamhshocraithe robots.txt i Joomla! 3.3 chun ligean do Google rochtain a fháil ar theimpléid agus ar chomhaid meán de réir réamhshocraithe chun SEO a fheabhsú. Ní chuirtear an t-athrú seo i bhfeidhm go huathoibríoch ar uasghráduithe agus moltar d'úsáideoirí athbhreithniú a dhéanamh ar na hathruithe sa chomhad robots.txt.dist agus na hathruithe seo a chur i bhfeidhm ina gcomhad robots.txt féin."
COM_CPANEL_MSG_ROBOTS_TITLE="Nuashonrú robots.txt"
COM_CPANEL_MSG_STATS_COLLECTION_BODY="<p>Ó Joomla! 3.5 cuirfidh breiseán staitisticí sonraí gan ainm chuig Tionscadal Joomla. Ní chuirfidh sé isteach ach an leagan Joomla, leagan PHP, inneall bunachar sonraí agus leagan, agus córas oibriúcháin an fhreastalaí.</p><p>Bailítear na sonraí seo chun a chinntiú gur féidir le leaganacha amach anseo de Joomla leas a bhaint as na gnéithe is déanaí de bhunachar sonraí agus PHP gan tionchar a imirt ar líon suntasach úsáideoirí. Tháinig an gá leis seo chun solais nuair a bhí íosmhéid de PHP 5.3.10 ag teastáil nuair a chuir Joomla! 3.3 na pasfhocail níos sláine Bcrypt i bhfeidhm.</p><p>Ar mhaithe le trédhearcacht iomlán agus chun cabhrú le forbróirí <a href=\"https://developer.joomla.org/about/stats.html\" target=\"_blank\" rel=\"noopener noreferrer\">tá na sonraí seo ar fáil go poiblí.</a> Taispeánfaidh API agus graif an leagan Joomla, leaganacha PHP agus innill bhunachar sonraí in úsáid.</p><p>Mura dteastaíonn uait an fhaisnéis seo a sholáthar do Thionscadal Joomla is féidir leat an breiseán darb ainm Córas - Staitisticí Joomla a dhíchumasú.</p>"
COM_CPANEL_MSG_STATS_COLLECTION_TITLE="Bailiú Staitisticí i Joomla"
COM_CPANEL_MSG_TEXTFILTER3919_BODY="<p>Mar chuid d'athbhreithniú ár bhfoireann slándála, rinneamar roinnt athruithe ar na socruithe réamhshocraithe do na scagairí téacs domhanda i suiteáil nua Joomla. Is é an socrú réamhshocraithe do na grúpaí 'Poiblí', 'Aoi' agus 'Cláraithe' ná 'Gan HTML'. Ós rud é nach gcuirtear na hathruithe seo i bhfeidhm ach ar shuiteálacha nua, molaimid go láidir duit athbhreithniú a dhéanamh ar na hathruithe seo agus do shuíomh a nuashonrú ó: Córas &rarr; Cumraíocht Dhomhanda &rarr; Scagairí Téacs</p>"
COM_CPANEL_MSG_TEXTFILTER3919_TITLE="Moltaí Scagaire Téacs Nuashonraithe"
