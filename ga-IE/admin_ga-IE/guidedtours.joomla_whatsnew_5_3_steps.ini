COM_GUIDEDTOURS_TOUR_WHATSNEW_5_3_STEP_0_DESCRIPTION="<h3>Nótaí Eisiúna Iomlána Joomla 5.3</h3><p><a title=\"Nótaí eisiúna iomlána\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Féach na nótaí eisiúna iomlána ar joomla.org</a></p><hr><h3>Cabhair agus Eolas</h3><p>Is féidir go leor acmhainní chun cabhrú leat a fháil anseo in éineacht le naisc bhreise chuig níos mó acmhainní, doiciméadú, tacaíocht agus conas a bheith páirteach i Joomla.</p>"
