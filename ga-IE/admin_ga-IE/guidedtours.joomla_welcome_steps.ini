COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_TITLE="An Roghchlár"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_DESCRIPTION="<p>Soláthraíonn an roghchlár rochtain ar leathanaigh bainistíochta an Riarthóra. Tá bailiúchán de leathanaigh i ngach rannóg chun an ghné áirithe sin de Joomla a bhainistiú, mar Ábhar, Roghchláir agus Úsáideoirí.</p><p>Nascann na deilbhíní painéil fuinneoige le painéil rialaithe aonair do na rannóga sin. Treoraíonn an roghchlár Córas féin chuig painéal rialaithe.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_TITLE="Na Painéil Painéal Rialaithe"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_DESCRIPTION="<p>Soláthraíonn painéil rialaithe rochtain thapa ar leathanaigh a úsáidtear go minic trína ndeilbhíní.</p><p>Is modúl Riarthóra é gach painéal painéal rialaithe is féidir a shaincheapadh trína dheilbhín Socruithe <span class=\"icon-cogs\" aria-hidden=\"true\"></span>.<br>Ceadaíonn sé seo duit painéil rialaithe do shuíomh a chumrú chun freastal ar do chuspóirí féin.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_TITLE="An Painéal Fógraí"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_DESCRIPTION="<p>Taispeánann an painéal fógraí nuair a bhíonn nuashonruithe ar fáil do Joomla agus síneadh eile. Taispeántar Iarratais Príobháideachta gan réiteach anseo freisin.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_TITLE="An Barra Barr"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_DESCRIPTION="<p>Taispeánann an barra barr teideal na leathanaigh atá ar taispeáint ionas go mbeidh a fhios agat i gcónaí cá bhfuil tú. Is modúil roghnacha iad na míreanna eile sa bharra barr.</p><p>De ghnáth is féidir an leagan reatha de Joomla agus rochtain ar thurais threoraithe breise a fháil anseo.</p><p>De ghnáth is nasc chuig an gcomhéadan Suíomh agus an Roghchlár Úsáideora na míreanna deireanacha áit ar féidir leat do chuntas a bhainistiú agus logáil amach.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_TITLE="Cabhair agus Eolas"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_DESCRIPTION="<p>Is féidir go leor acmhainní chun cabhrú leat a fháil anseo in éineacht le naisc bhreise chuig níos mó acmhainní, doiciméadú, tacaíocht agus conas a bheith páirteach i Joomla.</p>"
