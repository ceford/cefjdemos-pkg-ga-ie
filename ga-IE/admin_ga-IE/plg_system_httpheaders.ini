PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP' target='_blank' rel='noopener noreferrer'>Beartas Slándála Ábhair (CSP)</a>" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_CLIENT="Cliant"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED="frame-ancestors 'self'" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED_DESC="Cumasaigh an chosaint CSP clickjacking frame-ancestors agus ceadaigh an bunús 'self' amháin. Bain úsáid as an bhfoirm thíos chun bunúsacha eile seachas 'self' a cheadú."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/nonce' target='_blank' rel='noopener noreferrer'>Nonce</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED_DESC="Cumasaigh an liosta bán do scripteanna inlíne ar leith ag úsáid nonce criptigineach (uimhir a úsáidtear uair amháin) do gach script agus stíl ag úsáid API Joomla. Trí nonce a shonrú déanann brabhsálaí nua-aimseartha neamhaird ar 'unsafe-inline' ar cheart fós a bheith socraithe do bhrabhsálaithe níos sine gan tacaíocht nonce."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY_DESC="Úsáid an ceanntásc 'Content-Security-Policy-Report-Only' in ionad 'Content-Security-Policy'." ; Do not translate 'Content-Security-Policy' & 'Content-Security-Policy-Report-Only'
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY="Tuairisc-Amháin" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED="strict-dynamic" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED_DESC="Sonraíonn an léiriú foinse strict-dynamic go gcaithfear an muinín a thugtar go sainráite do script atá i láthair sa mharcáil, trí é a thionlacan le nonce nó hash, a scaipeadh chuig na scripteanna go léir a luchtú an script fréimhe sin. Ag an am céanna, déanfar neamhaird ar aon léirithe ceadaithe nó foinse mar 'self' nó 'unsafe-inline'." ; Do not translate 'strict-dynamic', 'self' and 'unsafe-inline'
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src' target='_blank' rel='noopener noreferrer'>Hashanna script</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED_DESC="Cumasaigh an liosta bán roghnach bunaithe ar hash do scripteanna inlíne ag úsáid hash criptigineach do gach script ag úsáid API Joomla. Trí hashanna a shonrú déanann brabhsálaí nua-aimseartha neamhaird ar 'unsafe-inline' ar cheart fós a bheith socraithe do bhrabhsálaithe níos sine gan tacaíocht hash."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/style-src' target='_blank' rel='noopener noreferrer'>Hashanna stíl</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED_DESC="Cumasaigh an liosta bán roghnach bunaithe ar hash do stíleanna inlíne ag úsáid hash criptigineach do gach stíl ag úsáid API Joomla. Trí hashes a shonrú déanann brabhsálaí nua-aimseartha neamhaird ar 'unsafe-inline' ar cheart a bheith socraithe fós do bhrabhsálaithe níos sine gan tacaíocht hash."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES="Cuir Treoir Leis"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_DIRECTIVE="Treoir Beartais"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_VALUE="Luach"
PLG_SYSTEM_HTTPHEADERS_COOP="Cross-Origin-Opener-Policy" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT="Cliant"
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT_BOTH="An Dá Rud"
PLG_SYSTEM_HTTPHEADERS_HSTS="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security' target='_blank' rel='noopener noreferrer'>Slándáil Iompair Dhiansheasmhach HTTP (HSTS)</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE="max-age" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE_DESC="Socraíonn an rogha seo an t-am do 'max-age', sonraítear é i soicindí. Is é 31536000 an luach réamhshocraithe, a fhreagraíonn do bhliain amháin" ; Please do not translate 'max-age'
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD="<a href='https://hstspreload.org' target='_blank' rel='noopener noreferrer'>Réamh-ualach</a>" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_DESC="Gníomhaíonn an rogha seo an rogha isteach le haghaidh áireamh i liostaí réamh-ualach brabhsálaí mar a thugtar orthu."
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE="Tábhachtach"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE_DESC="Ciallaíonn HSTS nach féidir do fhearann a ghlaoch a thuilleadh gan HTTPS. Nuair a chuirtear leis an liosta réamh-ualach é, níl sé éasca é seo a chealú. Is féidir fearainn a bhaint, ach tógann sé míonna ar úsáideoirí athrú a dhéanamh le nuashonrú brabhsálaí.<br><strong>Tá an rogha seo an-tábhachtach chun 'ionsaithe fear-i-lár' a chosc, mar sin ba cheart é a ghníomhachtú in aon chás, ach amháin má tá tú cinnte go bhfuil tacaíocht HTTPS ar fáil don fhearann agus do gach fo-fhearann san fhadtéarma! Caithfidh an luach do 'max-age' a bheith socraithe go 63072000 (2 bhliain) le haghaidh taifeadta.</strong>" ; Please do not translate 'max-age'
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS="Chomh maith le fo-fhearainn"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS_DESC="Ba cheart HSTS a chumasú freisin <strong>do fho-fhearainn</strong> de ghnáth cuirtear an fo-fhearann 'www' san áireamh agus an deimhniú SSL á chruthú. Má úsáidtear fo-fhearainn eile, tabhair faoi deara go gcuirtear deimhniú SSL bailí ar fáil dóibh freisin."
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_ACTION="Cumasaigh ceanntásca slándála réamhshocraithe"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_BODY="<p>Tagann Joomla! le sraith uirlisí ionsuite a chabhraíonn leat ceanntásca slándála http a láimhseáil. Cabhraíonn na ceanntásca seo le do bhrabhsálaí mar shampla chun do shuíomh Gréasáin a chosaint ó ionsaithe <a href='https://en.wikipedia.org/wiki/Cross-site_scripting' target='_blank' rel='noopener noreferrer'>XSS</a> agus <a href='https://en.wikipedia.org/wiki/Clickjacking' target='_blank' rel='noopener noreferrer'>Clickjacking</a>.</p><p>Is féidir leat tuilleadh sonraí a fháil sa <a href='https://docs.joomla.org/Special:MyLanguage/J4.x:Http_Header_Management' target='_blank' rel='noopener noreferrer'>Teagaisc Bainistíochta Ceanntásca HTTP i dDoiciméadú Joomla!</a></p>"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_TITLE="Ceanntásca Slándála HTTP"
