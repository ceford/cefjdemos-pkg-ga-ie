PLG_LDAP_FIELD_PASSWORD_LABEL="Pasfhocal Ceangail"
PLG_LDAP_FIELD_PORT_LABEL="Calafoirt"
PLG_LDAP_FIELD_REFERRALS_DESC="Socraíonn an rogha seo luach an bhratach LDAP_OPT_REFERRALS. Beidh ort é a shocrú go Níl do fhreastalaithe Windows 2003."
PLG_LDAP_FIELD_REFERRALS_LABEL="Lean Atreoruithe"
PLG_LDAP_FIELD_SEARCHSTRING_DESC="Téacs fiosrúcháin a úsáidtear chun cuardach a dhéanamh ar Úsáideoir ar leith. Déantar an eochairfhocal [search] a athsholáthar go dinimiciúil leis an logáil isteach a sholáthraíonn an tÚsáideoir. Sampla de théacs is ea: uid=[search]. Is féidir roinnt téacsanna a úsáid scartha le leathcholúin. Úsáidtear tar éis an ceangal tosaigh do gach modh."
PLG_LDAP_FIELD_SEARCHSTRING_LABEL="Téacs Cuardaigh"
PLG_LDAP_FIELD_UID_DESC="Tréith LDAP ina bhfuil ID Logála an Úsáideora. Maidir le Eolaire Gníomhach is é seo sAMAccountName."
PLG_LDAP_FIELD_UID_LABEL="Léarscáil: ID Úsáideora"
PLG_LDAP_FIELD_USERNAME_DESC="Sainmhíníonn an t-Úsáideoir Ceangail agus an Pasfhocal Ceangail paraiméadair ceangail don chéim breathnaithe DN. Tá dhá rogha ar fáil: breathnú DN gan ainm (Fág an dá réimse folamh) agus ceangal riaracháin (Is é an t-Úsáideoir Ceangail ainm úsáideora cuntas riaracháin, mar shampla Riarthóir). Úsáidtear ach amháin i modh Ceangail agus Cuardaigh."
PLG_LDAP_FIELD_USERNAME_LABEL="Úsáideoir Ceangail"
PLG_LDAP_FIELD_USERSDN_DESC="Déantar an eochairfhocal [username] a athsholáthar go dinimiciúil leis an logáil isteach a sholáthraíonn an tÚsáideoir. Sampla de théacs is ea: uid=[username], dc=mo-fearann, dc=com. Is féidir roinnt téacsanna a úsáid, scartha le leathcholúin. Úsáidtear ach amháin do mhodh Ceangail go Díreach mar Úsáideoir."
PLG_LDAP_FIELD_USERSDN_LABEL="DN an Úsáideora"
PLG_LDAP_FIELD_V3_DESC="Is é LDAP2 an réamhshocrú, ach éilíonn na leaganacha is déanaí de OpenLdap ar chliaint LDAPV3 a úsáid."
PLG_LDAP_FIELD_V3_LABEL="LDAP V3"
