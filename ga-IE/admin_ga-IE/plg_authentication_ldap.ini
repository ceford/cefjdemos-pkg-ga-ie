PLG_LDAP_FIELD_CACERT_DESC="Cosán iomlán chuig an gcomhad nó an eolaire ina féidir le Joomla teastas an fhreastalaí LDAP (Údarás Teastais) a fháil. Má tá sé seo folamh, úsáidtear réamhshocruithe an chórais do na roghanna cliant TLS_CACERT agus TLS_CACERTDIR LDAP."
PLG_LDAP_FIELD_ENCRYPTION_LABEL="Slándáil Ceangail"
