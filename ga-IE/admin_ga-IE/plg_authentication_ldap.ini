PLG_LDAP_XML_DESCRIPTION="<p>Déileálann sé le Fíordheimhniú Úsáideora i gcoinne freastalaí LDAP.</p><p><strong>Rabhadh! Caithfidh tú ar a laghad breiseán fíordheimhnithe amháin a bheith cumasaithe agat nó caillfidh tú rochtain ar do shuíomh.</strong></p>"
