PLG_LDAP_FIELD_FULLNAME_DESC="Tréith LDAP ina bhfuil ainm iomlán an Úsáideora."
PLG_LDAP_FIELD_FULLNAME_LABEL="Léarscáil: Ainm Iomlán"
PLG_LDAP_FIELD_HOST_LABEL="Óstach"
PLG_LDAP_FIELD_IGNORE_REQCERT_TLS_LABEL="Neamhaird a dhéanamh ar an Teastas"
PLG_LDAP_FIELD_LDAPDEBUG_DESC="Cumasaíonn dífhabhtú crua-chódaithe go leibhéal 7"
