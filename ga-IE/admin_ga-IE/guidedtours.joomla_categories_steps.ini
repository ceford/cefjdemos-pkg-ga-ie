COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_NEW_TITLE="Roghnaigh an cnaipe 'Nua'"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_NEW_DESCRIPTION="Roghnaigh 'Nua' chun catagóir nua a chruthú."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_TITLE_TITLE="Cuir teideal leis an gcatagóir"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_TITLE_DESCRIPTION="Cuir isteach teideal riachtanach don chatagóir."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_ALIAS_TITLE="Cuir isteach ailias"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_ALIAS_DESCRIPTION="Is féidir leat ainm inmheánach na catagóire seo a scríobh. Is féidir leat é seo a fhágáil bán agus úsáidfear luach réamhshocraithe i litreacha beaga le fleiscíní in ionad spásanna mar chuid den URL."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_CONTENT_TITLE="Cuir ábhar leis"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_CONTENT_DESCRIPTION="Cuir ábhar do chatagóir san eagarthóir."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_PARENT_TITLE="Roghnaigh catagóir tuismitheora"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_PARENT_DESCRIPTION="Roghnaigh nó cuir isteach tuismitheoir na catagóire."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_STATUS_TITLE="Roghnaigh an stádas"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_STATUS_DESCRIPTION="Roghnaigh stádas foilsithe na catagóire."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_ACCESS_TITLE="Socraigh an leibhéal rochtana"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_ACCESS_DESCRIPTION="Roghnaigh an leibhéal rochtana don chatagóir."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_TAGS_TITLE="Cuir clibeanna leis"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_TAGS_DESCRIPTION="Roghnaigh clibeanna do do chatagóir. Is féidir leat clib nua a chur isteach freisin trí ainm a chlóscríobh sa réimse agus brúigh iontráil."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_NOTE_TITLE="Cuir nóta leis"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_NOTE_DESCRIPTION="De ghnáth bíonn sé seo le húsáid ag an riarthóir agus ní thaispeántar é ar an taobh tosaigh."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_VERSIONNOTE_TITLE="Cuir nóta leagan leis"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_VERSIONNOTE_DESCRIPTION="Is réimse roghnach é seo chun leagan na catagóire seo a aithint."

COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_SAVECLOSE_TITLE="Roghnaigh 'Sábháil agus Dún'"
COM_GUIDEDTOURS_TOUR_CATEGORIES_STEP_SAVECLOSE_DESCRIPTION="Sábháil agus dún an chatagóir."

