COM_CONFIG_FIELD_DEFAULT_CAPTCHA_DESC="Is féidir le Joomla agus síntí tríú páirtí <a href=\"https://en.wikipedia.org/wiki/CAPTCHA\" target=\"_blank\" rel=\"noopener noreferrer\">CAPTCHA</a> a úsáid chun mí-úsáid (spam) a chosc ar fhoirmeacha poiblí. Is féidir le gach síneadh CAPTCHA difriúil a roghnú le húsáid, má tá níos mó ná ceann amháin ar fáil. Mura ndéantar aon rogha, úsáidfear é seo de réir réamhshocraithe. Is féidir leat modhanna CAPTCHA breise a chumasú i gCóras, Bainistiú, Breiseáin."
COM_CONFIG_FIELD_DEFAULT_CAPTCHA_LABEL="CAPTCHA Réamhshocraithe"
COM_CONFIG_FIELD_DEFAULT_EDITOR_DESC="Úsáidfear an t-eagarthóir seo chun ábhar agus réimsí téacs saibhir eile a chur in eagar i síntí tríú páirtí mura bhfuil eagarthóir difriúil roghnaithe ag úsáideoir ina bpróifíl úsáideora. Beidh sé seo freisin an t-aon eagarthóir atá ar fáil agus in úsáid d'úsáideoirí nach bhfuil logáilte isteach cheana féin (an grúpa úsáideoirí Aoi)."
