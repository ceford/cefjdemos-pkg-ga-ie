COM_CONFIG_FIELD_DEBUG_SYSTEM_DESC="Úsáid é ach amháin le haghaidh fabhtcheartaithe, go hidéalach ar chóipeanna <em>príobháideacha</em> de do shuíomh. Is féidir leis an bhfaisnéis theicniúil níos mó a thaispeántar sa mhodh seo a bheith ina riosca slándála má fhágtar ar chumas é ar shuíomhanna beo. Cuimhnigh an breiseán \"Córas - Dífhabhtú\" a fhoilsiú chun faisnéis mhionsonraithe a fháil ar gach leathanach atá á luchtú."
