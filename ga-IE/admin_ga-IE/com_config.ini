COM_CONFIG_FIELD_SERVER_TIMEZONE_DESC="Úsáidtear de réir réamhshocraithe chun dátaí agus amanna a thaispeáint (stórálann Joomla iad go hinmheánach mar UTC). Féadfaidh sé seo a bheith difriúil ná crios ama do fhreastalaí. Is féidir le húsáideoirí a gcrios ama is fearr a shárú ina bpróifíl úsáideora."
