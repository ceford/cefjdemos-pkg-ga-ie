JLIB_RULES_SETTING_NOTES_COM_CONFIG="Má athraíonn tú an socrú, cuirfear i bhfeidhm é ar an ngrúpa seo agus ar gach grúpa leanaí, comhpháirteanna agus ábhar. Tabhair faoi deara:<br><em><strong>Oidhreachtaithe</strong></em> ciallaíonn sé go n-úsáidfear na ceadanna ón ngrúpa tuismitheora.<br><em><strong>Séanadh</strong></em> ciallaíonn sé nach cuma cad é socrú an ghrúpa tuismitheora, ní féidir leis an ngrúpa atá á chur in eagar an gníomh seo a dhéanamh.<br><em><strong>Ceadaithe</strong></em> ciallaíonn sé go mbeidh an grúpa atá á chur in eagar in ann an gníomh seo a dhéanamh (ach má tá sé seo i gcoimhlint leis an ngrúpa tuismitheora ní bheidh aon tionchar aige; léirítear coimhlint le <em><strong>Ní Ceadaithe (Glasáilte)</strong></em> faoi Shocruithe Ríofa).<br><em><strong>Ní Socraithe</strong></em> úsáidtear é ach amháin don ghrúpa Poiblí i gcumraíocht dhomhanda. Is é an grúpa Poiblí tuismitheoir na ngrúpaí eile go léir. Mura bhfuil cead socraithe, déileáiltear leis mar dhiúltú ach is féidir é a athrú do ghrúpaí leanaí, comhpháirteanna, catagóirí agus míreanna."
