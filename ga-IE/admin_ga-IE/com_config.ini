COM_CONFIG_TEXT_FILTERS_DESC="Cuirfear na socruithe scagaire téacs seo i bhfeidhm ar gach réimse eagarthóra téacs sna grúpaí roghnaithe.<br>Tugann na roghanna scagtha seo níos mó smachta ar an HTML a chuireann do sholáthraithe ábhair isteach. Is féidir leat a bheith chomh dian nó chomh flaithiúil agus is gá chun freastal ar riachtanais do shuíomh. Tá an scagadh roghnach agus soláthraíonn na socruithe réamhshocraithe cosaint mhaith i gcoinne marcáil a bhaineann go coitianta le hionsaithe ar láithreáin ghréasáin."
