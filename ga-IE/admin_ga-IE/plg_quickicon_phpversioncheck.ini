PLG_QUICKICON_PHPVERSIONCHECK="Deilbhín Tapa - Seiceáil Leagan PHP"
PLG_QUICKICON_PHPVERSIONCHECK_SECURITY_ONLY="Tá do leagan PHP, %1$s, ag fáil socruithe slándála amháin ón tionscadal PHP ag an am seo. Ciallaíonn sé seo nach mbeidh tacaíocht ar fáil do do leagan PHP go luath. Molaimid pleanáil chun uasghrádú a dhéanamh go leagan PHP níos nuaí sula sroicheann sé deireadh tacaíochta ar %2$s. Beidh Joomla níos tapúla agus níos sláine má uasghrádaíonn tú go leagan PHP níos nuaí. Téigh i dteagmháil le do óstach le haghaidh treoracha uasghrádaithe."
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED="Tá sé aimsithe againn go bhfuil do fhreastalaí ag úsáid PHP %1$s atá as dáta agus nach bhfaigheann nuashonruithe slándála oifigiúla óna fhorbróirí a thuilleadh. Molann Tionscadal Joomla! do shuíomh a uasghrádú go PHP %2$s nó níos déanaí a gheobhaidh nuashonruithe slándála ar a laghad go dtí %3$s. <br><br>Iarr ar do óstach PHP %2$s nó leagan níos déanaí a dhéanamh mar an leagan réamhshocraithe do do shuíomh. Má tá do óstach réidh cheana féin le haghaidh PHP %2$s cuir PHP %2$s ar chumas i bhfréamh do shuíomh agus i bhfillteáin 'riarthóir' - de ghnáth is féidir leat é seo a dhéanamh tú féin trí uirlis i bpainéal rialaithe óstála, ach is fearr fiafraí de do óstach má tá tú neamhchinnte."
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED_JOOMLA_OUTDATED="Tá sé aimsithe againn go bhfuil do fhreastalaí ag úsáid PHP %1$s atá as dáta agus nach bhfaigheann nuashonruithe slándála oifigiúla óna fhorbróirí a thuilleadh. Thairis sin, ní féidir linn leagan PHP níos nuaí a mholadh mar go bhfuil tú ag úsáid leagan Joomla! atá as dáta. Molaimid Joomla! a nuashonrú agus ansin treoracha breise uasghrádaithe PHP a leanúint."
PLG_QUICKICON_PHPVERSIONCHECK_XML_DESCRIPTION="Seiceálann sé stádas tacaíochta leagan PHP d'instalála agus ardaíonn sé rabhadh mura bhfuil sé tacaíocht iomlán."
