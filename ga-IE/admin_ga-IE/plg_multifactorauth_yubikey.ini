PLG_MULTIFACTORAUTH_YUBIKEY="Fíordheimhniú Ilfhachtóra - YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_CAPTIVE_PROMPT="Cliceáil sa bhosca téacs thíos le do thoil. Ansin cuir isteach do YubiKey i gcalafort USB do ghléis agus bain teagmháil lena dhiosca órga nó le ceap órga (ag brath ar do mhúnla) chun cód YubiKey a ghiniúint. Má tá tú ar fhón nó táibléad atá in ann NFC a úsáid le YubiKey cumasaithe NFC, ní mór duit do YubiKey a chur i ngar do limistéar léitheora NFC do ghutháin nó do tháibléid."
PLG_MULTIFACTORAUTH_YUBIKEY_CODE_LABEL="Cód YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_ERR_VALIDATIONFAILED="Níor chuir tú isteach cód rúnda YubiKey bailí nó níl freastalaithe YubiCloud inrochtana ag an am seo."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_AFTERSETUP_INSTRUCTIONS="Tá do YubiKey socraithe agat cheana féin (an ceann a ghineann cóid ag tosú le <code>%s</code>). Ní féidir leat ach a theideal a athrú ón leathanach seo."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_INSTRUCTIONS="Tabhair cód a ghineann do <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">YubiKey</a> thíos le do thoil agus ansin cliceáil nó bain teagmháil leis an gcnaipe Deimhnigh. Sábhálfar na chéad dhá charachtar déag, is é sin an cód aitheantais uathúil do do YubiKey."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_LABEL="Aitheantas YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_PLACEHOLDER="Cuir isteach cód YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_METHOD_TITLE="YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_SHORTINFO="Úsáid sliseanna crua-earraí slán YubiKey."
PLG_MULTIFACTORAUTH_YUBIKEY_XML_DESCRIPTION="Ligeann sé d'úsáideoirí ar do shuíomh Fíordheimhniú Ilfhachtóra a úsáid ag baint úsáide as sliseanna crua-earraí slán YubiKey. Teastaíonn a YubiKey féin ó úsáideoirí atá ar fáil ó <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.yubico.com</a>. Chun Fíordheimhniú Ilfhachtóra a úsáid, caithfidh úsáideoirí a bpróifíl úsáideora a chur in eagar agus Fíordheimhniú Ilfhachtóra a chumasú."
