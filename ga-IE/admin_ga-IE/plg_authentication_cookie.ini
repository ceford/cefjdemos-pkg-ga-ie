PLG_AUTHENTICATION_COOKIE_PRIVACY_CAPABILITY_COOKIE="I gcomhar le breiseán a thacaíonn le gné \"Cuimhnigh Orm\", mar shampla an breiseán \"Córas - Cuimhnigh Orm\", cruthaíonn an breiseán seo fianán i mbrabhsálaí an úsáideora má roghnaítear bosca seiceála \"Cuimhnigh Orm\" nuair a logálann siad isteach ar an suíomh gréasáin. Is féidir an fianán seo a aithint leis an réimír `joomla_remember_me` agus úsáidtear é chun úsáideoirí a logáil isteach go huathoibríoch ar an suíomh gréasáin nuair a thugann siad cuairt agus nach bhfuil siad logáilte isteach cheana féin."
