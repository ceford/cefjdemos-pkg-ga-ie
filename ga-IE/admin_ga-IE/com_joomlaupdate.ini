COM_JOOMLAUPDATE_ERRORMODAL_BODY_FORBIDDEN="<p>Ní féidir le Joomla cumarsáid a dhéanamh leis an gcomhad <code>administrator/components/com_joomlaupdate/extract.php</code> a dhéanann an nuashonrú. Tarlaíonn sé seo de ghnáth mar gheall ar cheann de na cúiseanna seo a leanas:</p><ul><li>Comhad cumraíochta freastalaí i bhfréamh do shuíomh, mar <code>.htaccess</code> nó <code>web.config</code>, a chuireann cosc ar rochtain ar an gcomhad seo.</li><li>Cuireann cumraíocht do fhreastalaí cosc ar rochtain ar an gcomhad seo.</li><li>Ní cheadaíonn úinéireacht agus ceadanna an chomhaid seo do do fhreastalaí rochtain a fháil ar an gcomhad seo.</li><li>Tá do shuíomh taobh thiar de chothromóir ualaigh nó CDN ach ní cheadaíonn a chumraíocht rochtain ar an gcomhad seo nó cuireann sé bac ar orduithe a sheoladh chuige.</li><li>Cé gur féidir rochtain a fháil ar an gcomhad, cuireann cosaint do fhreastalaí mar mod_security2 bac ar orduithe a sheoladh chuige.</li></ul><p>Mura bhfuil tú cinnte déan teagmháil le do óstach le do thoil.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_INVALIDLOGIN="<p>Ní féidir le Nuashonrú Joomla cumarsáid a dhéanamh i gceart leis an <code>administrator/components/com_joomlaupdate/extract.php</code> a dhéanann an nuashonrú. Tarlaíonn sé seo de ghnáth mar gheall ar cheann de na cúiseanna seo a leanas:</p><ul><li>Níorbh fhéidir an comhad <code>administrator/components/com_joomlaupdate/update.php</code>, ina bhfuil na treoracha chun an nuashonrú a chur i bhfeidhm, a chruthú m.sh. mar gheall ar fhadhbanna ceadanna.</li><li>Ní féidir leis an script <code>extract.php</code> an comhad thuasluaite a léamh mar gheall ar fhadhbanna ceadanna.</li><li>Tá do bhrabhsálaí, do threalamh líonra nó do fhreastalaí ag truailliú an phasfhocail atá á sheoladh againn le gach iarratas chuig <code>extract.php</code> ar chúiseanna slándála</li></ul><p>Bain triail as brabhsálaí difriúil a úsáid, gan aon síneadh brabhsálaí suiteáilte, go hidéalach ar ríomhaire difriúil atá ceangailte leis an Idirlíon ag úsáid soláthraí difriúil. Má leanann an earráid ar aghaidh, b'fhéidir gur mhaith leat teagmháil a dhéanamh le d'óstach.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_SERVERERROR="<p>Tharla earráid freastalaí nuair a bhí Nuashonrú Joomla ag cur an nuashonrú i bhfeidhm ar do shuíomh.</p><p>B'fhéidir nach bhfuil do shuíomh uasghrádaithe go hiomlán go dtí an leagan nua de Joomla.</p>"
