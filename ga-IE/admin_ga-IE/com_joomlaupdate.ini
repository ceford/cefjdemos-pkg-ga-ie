COM_JOOMLAUPDATE_VIEW_DEFAULT_UPDATE_NOTICE="Sula ndéanann tú Joomla a nuashonrú, cinntigh go bhfuil na síntí suiteáilte ar fáil don leagan nua de Joomla. <br>Moltar go láidir duit <strong>cúltaca</strong> de chomhaid agus de bhunachar sonraí do shuíomh a dhéanamh sula dtosaíonn tú ag nuashonrú."
COM_JOOMLAUPDATE_VIEW_DEFAULT_UPDATEFOUND="Aimsíodh nuashonrú Joomla."
COM_JOOMLAUPDATE_VIEW_DEFAULT_UPDATES_INFO_CUSTOM="Tá tú ar an gcainéal nuashonraithe &quot;%s&quot;. Ní cainéal oifigiúil nuashonraithe Joomla é seo."
COM_JOOMLAUPDATE_VIEW_DEFAULT_UPDATES_INFO_DEFAULT="Tá tú ar an gcainéal nuashonraithe &quot;%s&quot;. Tríd an gcainéal seo gheobhaidh tú fógraí do gach nuashonrú den eisiúint Joomla reatha (5.x)"
COM_JOOMLAUPDATE_VIEW_DEFAULT_UPDATES_INFO_NEXT="Tá tú ar an gcainéal nuashonraithe &quot;%s&quot;. Tríd an gcainéal seo cuirfear ar an eolas tú nuair a bheidh an t-eisiúint mhór amach anseo (6.x) ar fáil. Sula ndéanfaidh tú uasghrádú go 6.x beidh ort a chomhoiriúnacht le do thimpeallacht a mheas. Ní chuirfear ar an eolas tú faoi nuashonruithe ar an eisiúint Joomla reatha (5.x)."
COM_JOOMLAUPDATE_VIEW_DEFAULT_UPDATES_INFO_TESTING="Tá tú ar an gcainéal nuashonraithe &quot;%s&quot;. Tá an cainéal seo deartha chun eisiúintí nua agus socruithe i Joomla a thástáil.<br>Níl sé beartaithe ach do bhaill JBS (Joomla Bug Squad&trade;) agus daoine eile laistigh de phobal Joomla atá ag tástáil. Ná húsáid an socrú seo ar shuíomh táirgthe."
COM_JOOMLAUPDATE_VIEW_DEFAULT_UPLOAD_INTRO="Is féidir leat an ghné seo a úsáid chun Joomla a nuashonrú má tá do fhreastalaí taobh thiar de bhalla dóiteáin nó mura bhfuil sé in ann teagmháil a dhéanamh leis na freastalaithe nuashonraithe. Ar dtús íoslódáil an <em><strong>Pacáiste Nuashonraithe</strong></em> Joomla i bhformáid ZIP ó <a class='alert-link' href='%s' target='_blank' rel='noopener noreferrer'>leathanach íoslódála oifigiúil Joomla</a>. Ansin bain úsáid as na réimsí thíos chun é a uaslódáil agus a shuiteáil."
