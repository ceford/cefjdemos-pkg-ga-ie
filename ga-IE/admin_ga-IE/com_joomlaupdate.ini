COM_JOOMLAUPDATE_VIEW_DEFAULT_PACKAGE_INFO="Is féidir leat <a href=\"%s\" class=\"alert-link\" target=\"_blank\" rel=\"noopener noreferrer\">an pacáiste nuashonraithe</a> a íoslódáil chuig do ríomhaire agus ansin na réimsí thíos a úsáid chun é a uaslódáil agus a shuiteáil."
COM_JOOMLAUPDATE_VIEW_DEFAULT_PACKAGE_REINSTALL="URL pacáiste athsuiteála"
COM_JOOMLAUPDATE_VIEW_DEFAULT_PHP_VERSION_NOT_SUPPORTED="Níl do leagan PHP tacaíochta"
COM_JOOMLAUPDATE_VIEW_DEFAULT_PHP_VERSION_NOT_SUPPORTED_DESC="Fuarthas nuashonrú do Joomla %1$s, ach ní oireann an leagan PHP atá suiteáilte agat faoi láthair do <a href=\"https://downloads.joomla.org/technical-requirements\">na riachtanais íosta do Joomla %1$s</a>."
COM_JOOMLAUPDATE_VIEW_DEFAULT_POTENTIALLY_DANGEROUS_PLUGIN="Fadhb Féideartha Nuashonraithe."
COM_JOOMLAUPDATE_VIEW_DEFAULT_POTENTIALLY_DANGEROUS_PLUGIN_CONFIRM_MESSAGE="An bhfuil tú cinnte gur mian leat na rabhaidh faoi fhorlíontáin a d'fhéadfadh a bheith neamh-chomhoiriúnach a aithint agus leanúint ar aghaidh leis an nuashonrú?"
COM_JOOMLAUPDATE_VIEW_DEFAULT_POTENTIALLY_DANGEROUS_PLUGIN_DESC="Tá breiseán san fhorlíonadh seo a d'fhéadfadh an nuashonrú a theip.<br><br>Chun an nuashonrú Joomla a dhéanamh go sábháilte ba cheart duit an fhorlíonadh seo a nuashonrú go leagan atá comhoiriúnach le do leagan sprioc de Joomla nó na breiseáin ábhartha a dhíchumasú agus seiceáil arís."
