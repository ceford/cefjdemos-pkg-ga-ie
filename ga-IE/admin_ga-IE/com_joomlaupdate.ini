COM_JOOMLAUPDATE_VIEW_DEFAULT_NO_LIVE_UPDATE_DESC="Ní mór duit an chomhpháirt seo a nuashonrú ar dtús sula féidir leat Joomla a nuashonrú! <a class=\"alert-link\" href=\"index.php?option=com_installer&view=update\">Cliceáil anseo chun an chomhpháirt a nuashonrú</a>."
COM_JOOMLAUPDATE_VIEW_DEFAULT_NON_CORE_PLUGIN_BEING_CHECKED="Tá an córas ag seiceáil na mbreiseán seo faoi láthair chun a fheiceáil an bhféadfadh siad fadhbanna a chruthú le linn an nuashonraithe.<br><br>Bí foighneach agus na seiceálacha á gcríochnú."
COM_JOOMLAUPDATE_VIEW_DEFAULT_NON_CORE_PLUGIN_CONFIRMATION="Aithin na rabhaidh faoi fhorlíontáin a d'fhéadfadh a bheith neamh-chomhoiriúnach agus lean ar aghaidh leis an nuashonrú."
