COM_JOOMLAUPDATE_VIEW_UPDATE_FINALISE_HEAD="Tá Nuashonrú Joomla ag críochnú agus ag glanadh suas"
COM_JOOMLAUPDATE_VIEW_UPDATE_FINALISE_HEAD_DESC="Chun an próiseas nuashonraithe a chríochnú, deimhnigh d’aitheantas trí fhaisnéis logála isteach do shuíomh &quot;%s&quot; a athiontráil thíos."
COM_JOOMLAUPDATE_VIEW_UPDATE_PERCENT="Céatadán críochnaithe"
COM_JOOMLAUPDATE_VIEW_UPLOAD_CAPTIVE_INTRO_BODY="Déan cinnte go dtagann an comhad nuashonraithe a uaslódáil tú ó leathanach íoslódála oifigiúil Joomla. Ina dhiaidh sin, deimhnigh le do thoil gur mian leat é a shuiteáil trí fhaisnéis logála isteach do shuíomh &quot;%s&quot; a athiontráil thíos."
COM_JOOMLAUPDATE_VIEW_UPLOAD_CAPTIVE_INTRO_HEAD="An bhfuil tú cinnte gur mian leat an comhad a uaslódáil tú a shuiteáil?"
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_DOWNGRADE="Tá leagan níos ísle \"%2$s\" ag an gcomhad pacáiste uaslódáilte \"%1$s\" ná an leagan atá suiteáilte \"%3$s\". Ní féidir leat suíomh Joomla a íosghrádú.<br>Seiceáil <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">leathanach íoslódála oifigiúil Joomla</a> le haghaidh Pacáiste Uasghrádaithe Joomla de <em><strong>leagan níos nuaí</strong></em>."
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_INSTALL_PACKAGE="Tá cuma ar an gcomhad pacáiste uaslódáilte \"%s\" gur pacáiste suiteála iomlán de Joomla é a úsáidtear ach amháin chun suíomhanna nua a chruthú. Ní féidir leat ach an <em><strong>Pacáiste Uasghrádaithe</strong></em> a úsáid chun do shuíomh a nuashonrú.<br>Seiceáil <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">leathanach íoslódála oifigiúil Joomla</a> le haghaidh Joomla <em><strong>Pacáiste Uasghrádaithe</strong></em> den leagan ceart."
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_NO_MANIFEST_FILE="Níl an comhad pacáiste uaslódáilte \"%s\" ina phacáiste nuashonraithe Joomla. Níl an comhad \"administrator/manifests/files/joomla.xml\" ann.<br>Seiceáil <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">leathanach íoslódála oifigiúil Joomla</a> le haghaidh Joomla <em><strong>Pacáiste Uasghrádaithe</strong></em> ceart."
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_NO_VERSION_FOUND="Níl an comhad pacáiste uaslódáilte \"%s\" ina phacáiste nuashonraithe Joomla. Níl faisnéis leagan bailí ann.<br>Seiceáil <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">leathanach íoslódála oifigiúil Joomla</a> le haghaidh Joomla <em><strong>Pacáiste Uasghrádaithe</strong></em> ceart."
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_PACKAGE_OPEN="Níl an comhad pacáiste uaslódáilte \"%s\" ina chomhad ZIP nó tá sé truaillithe.<br>Seiceáil <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">leathanach íoslódála oifigiúil Joomla</a> le haghaidh an Joomla <em><strong>Pacáiste Uasghrádaithe i bhformáid ZIP</strong></em> atá ag teastáil."
