JGLOBAL_FILTER_TYPE_DESC="<p>1. Ligeann Liosta Toirmiscthe gach clib agus tréith seachas iad siúd atá liostaithe.<br><strong>--</strong> I measc na gClibeanna don Liosta Toirmiscthe Réamhshocraithe tá: 'applet', 'body', 'bgsound', 'base', 'basefont', 'canvas', 'embed', 'frame', 'frameset', 'head', 'html', 'id', 'iframe', 'ilayer', 'layer', 'link', 'meta', 'name', 'object', 'script', 'style', 'title', 'xml'<br><strong>--</strong> I measc na dTréithe don Liosta Toirmiscthe Réamhshocraithe tá: 'action', 'background', 'codebase', 'dynsrc', 'lowsrc', 'formaction'<br><strong>--</strong> Is féidir leat clibeanna agus tréithe breise a thoirmeasc trí iad a chur leis na réimsí Clibeanna Scagaire agus Tréithe Scagaire, ag scaradh gach ainm clibe nó tréithe le camóg.<br><strong>--</strong> Ligeann Liosta Toirmiscthe Saincheaptha duit an Liosta Toirmiscthe Réamhshocraithe a shárú. Cuir na clibeanna agus na tréithe atá le toirmeasc sna réimsí Clibeanna Scagaire agus Tréithe Scagaire.</p><p>Ligeann Liosta Ceadaithe ach na clibeanna atá liostaithe sna réimsí Clibeanna Scagaire agus Tréithe Scagaire.</p><p>Bainfidh Gan HTML gach clib HTML as an ábhar nuair a shábháiltear é.</p><p>Tabhair faoi deara go n-oibríonn na socruithe seo beag beann ar an eagarthóir atá á úsáid agat. <br>Fiú má tá eagarthóir WYSIWYG á úsáid agat, féadfaidh na socruithe scagtha clibeanna agus tréithe breise a bhaint sula sábhálfar an t-eolas sa bhunachar sonraí.</p>"
