PLG_SAMPLEDATA_BLOG_OVERVIEW_DESC="Sonraí samplacha a bhunóidh suíomh blag le hailt, clibeanna, réimsí saincheaptha agus sreabhadh oibre.<br>Má tá an suíomh ilteangach, beidh na sonraí clibáilte leis an teanga ghníomhach ar an gcúlra."
PLG_SAMPLEDATA_BLOG_OVERVIEW_TITLE="Sonraí Samplacha Blag"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_INTROTEXT="<p>Insíonn sé seo beagán duit faoin mblag seo agus faoin duine a scríobhann é.</p><p>Nuair atá tú logáilte isteach beidh tú in ann an leathanach seo a chur in eagar trí dheilbhín an eagarthóra a roghnú.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_TITLE="Maidir"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_INTROTEXT="<p>Seo roinnt leideanna bunúsacha chun obair ar do shuíomh.</p><ul><li>Tá 'tosach' ag Joomla! atá á fheiceáil agat anois agus 'riarthóir' nó 'cúlra' atá ann chun an obair níos forbartha a dhéanamh chun do shuíomh a chruthú mar shampla na biachláir a bhunú agus cinneadh a dhéanamh ar na modúil atá le taispeáint. Ní mór duit logáil isteach sa riarthóir ar leithligh ag úsáid an ainm úsáideora agus an phasfhocail chéanna a d'úsáid tú chun logáil isteach sa chuid seo den suíomh.</li><li>Ceann de na chéad rudaí a bheidh tú ag iarraidh a dhéanamh is dócha ná teideal an tsuímh agus an líne clibe a athrú agus lógó a chur leis. Chun é seo a dhéanamh roghnaigh an nasc Socruithe Teimpléid sa roghchlár atá le feiceáil má logálann tú isteach. Chun cur síos ar do shuíomh, teideal an bhrabhsálaí, ríomhphost réamhshocraithe agus míreanna eile a athrú, roghnaigh Socruithe Suímh. Tá roghanna cumraíochta níos forbartha ar fáil sa riarthóir.</li><li>Chun cuma iomlán do shuíomh a athrú is dócha go mbeidh tú ag iarraidh teimpléad nua a shuiteáil. Téigh go dtí an Córas, roghnaigh Suiteáil - Breiseáin ón liosta agus osclóidh suiteálaí na breiseán. Tá go leor teimpléid saor in aisce agus tráchtála ar fáil do Joomla.</li><li>Mar a chonaic tú cheana, is féidir leat rialú a dhéanamh ar cé a fheiceann codanna éagsúla de do shuíomh. Nuair a oibríonn tú le modúil agus ailt, ciallaíonn socrú an leibhéal Rochtana go Cláraithe go mbeidh siad le feiceáil ag úsáideoirí logáilte isteach amháin.</li><li>Nuair a chruthaíonn tú alt nua nó cineál eile ábhair is féidir leat é a shábháil mar Fhoilsithe nó Neamhfhoilsithe freisin. Mura bhfuil sé Foilsithe ní bheidh cuairteoirí ar an suíomh in ann é a fheiceáil ach beidh tú in ann.</li><li>Is féidir leat i bhfad níos mó a fhoghlaim faoi obair le Joomla ón <a href=\"https://docs.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">suíomh doiciméadúcháin Joomla</a> agus cabhair a fháil ó úsáideoirí eile ar na <a href=\"https://forum.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">fóraim Joomla</a>. Sa riarthóir tá cnaipí cabhrach ar gach leathanach a sholáthraíonn faisnéis mhionsonraithe faoi na feidhmeanna ar an leathanach sin.</li></ul>"
