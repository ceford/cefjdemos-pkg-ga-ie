PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROTEXT="<p>Is sampla de bhlagphostáil é seo.</p><p>Má logálann tú isteach ar an suíomh (tá an nasc Logáil Isteach an Riarthóra ag bun an leathanaigh seo) beidh tú in ann é a chur in eagar agus na hailt eile atá ann cheana a chur in eagar. Beidh tú in ann alt nua a chruthú agus athruithe eile a dhéanamh ar an suíomh freisin.</p><p>De réir mar a chuireann tú ailt leis agus a mhodhnóidh tú iad, feicfidh tú conas a athraíonn do shuíomh agus conas is féidir leat é a shaincheapadh ar bhealaí éagsúla.</p><p>Ar aghaidh leat, ní féidir leat é a bhriseadh.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_TITLE="Fáilte chuig do bhlag"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FIELD_0="Glasaigh uurnip yarrow ricebean endive bláthchócairí leitís farraige kohlrabi amaranth spionáiste uisce avocado daikon cabáiste napa asparagus purslane geimhridh cál."
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FULLTEXT="<p>Ar an leathanach iomlán feicfidh tú an t-ábhar tosaigh agus an chuid eile den alt. Is féidir leat na socruithe a athrú chun an réamhrá a cheilt más mian leat.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_INTROTEXT="<p>Tá do leathanach baile socraithe chun na ceithre alt is déanaí ón gcatagóir blag a thaispeáint i gcolún. Ansin tá naisc chuig an dá alt is sine eile. Is féidir leat na huimhreacha sin a athrú trí na socruithe roghanna ábhair a chur in eagar sa chluaisín blag i do riarthóir láithreáin. Tá nasc chuig do riarthóir láithreáin má tá tú logáilte isteach.</p><p>Más mian leat do bhlagphost a bhriseadh ina dhá chuid, réamhrá agus ansin leathanach iomlán ar leithligh, bain úsáid as an span Léigh Tuilleadh chun sos a chur isteach.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_TITLE="Maidir le do leathanach baile"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXTIMAGE_ALT="Nebula Portán"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_INTROTEXT="<p>Tá roinnt modúil a úsáidtear go coitianta réamhchumraithe ar do shuíomh cheana féin. Áirítear orthu seo:</p><ul><li>Íomhá (cineál: Saincheaptha), a choinníonn an íomhá faoi bhun an roghchláir. Is modúl Saincheaptha é seo is féidir leat a chur in eagar chun an íomhá a athrú.</li><li>Clibeanna Coitianta (cineál: Clibeanna - Coitianta), a bheidh le feiceáil má úsáideann tú clibeáil ar do chuid alt. Cuir isteach clib sa réimse Clibeanna agus tú ag cur in eagar.</li><li>Poist Níos Sine (cineál: Ailt), a liostaíonn ailt de réir catagóirí.</li><li>Siondacáitiú (cineál: Beathanna Siondacáitithe), a ligeann do do léitheoirí do phoist a léamh i léitheoir nuachta.</li><li>Foirm Logála Isteach (cineál: Logáil Isteach), a ligeann do d’úsáideoirí rochtain a fháil ar limistéir srianta den suíomh Gréasáin.</li></ul><p>Tá go leor roghanna ag gach ceann de na modúil seo ar féidir leat triail a bhaint astu sa Bhainisteoir Modúl i do Riarthóir Láithreáin. Nuair a bheidh tú logáilte isteach is féidir leat an deilbhín eagarthóireachta a roghnú sa chúinne uachtarach ar dheis a thabharfaidh chuig scáileán eagarthóireachta don mhodúl sin tú. Bí cinnte i gcónaí aon mhodúl a chuireann tú in eagar a shábháil agus a dhúnadh.</p><p>Áiríonn Joomla! go leor modúl eile is féidir leat a ionchorprú i do shuíomh. De réir mar a fhorbraíonn tú do shuíomh b’fhéidir gur mhaith leat níos mó modúl a chur leis is féidir leat a fháil ag an <a href=\"https://extensions.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Eolaire Breiseán Joomla.</a></p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_TITLE="Do Mhóduil"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_INTROTEXT="<p>Rialaíonn teimpléid cuma agus mothú do shuíomh gréasáin.</p><p>Tá an blag seo suiteáilte leis an teimpléad Cassiopeia.</p><p>Is féidir leat na roghanna a chur in eagar trí roghnú an nasc Ag Obair ar Do Shuíomh, Socruithe Teimpléid sa roghchlár atá le feiceáil nuair a logálann tú isteach.</p><p>Mar shampla, is féidir leat dath cúlra an tsuímh, dathanna buaicphointí, teideal an tsuímh, cur síos ar an suíomh agus cló teidil a úsáidtear a athrú.</p><p>Tá níos mó roghanna ar fáil san riarthóir suímh. Féadfaidh tú teimpléad nua a shuiteáil freisin ag úsáid an bhainisteora síntí.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_TITLE="Do Theimpléad"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_6_FULLTEXT="<p>Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est</p>"
