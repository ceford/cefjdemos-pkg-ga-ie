PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_INTROTEXT="<p>Bainistíonn sreafaí oibre na céimeanna a chaithfidh d'altanna dul tríd go dtí go bhfoilseofar iad.</p><p>Níl an comhpháirt chun sreafaí oibre a bhainistiú cumasaithe de réir réamhshocraithe.</p><p>Chun an sreabhadh oibre a chuir muid ar fáil leis na sonraí samplacha a fheiceáil, ní mór duit an fheidhmiúlacht seo a chumasú ar dtús.</p><ol><li>Rochtain a fháil ar an limistéar riaracháin</li><li>Ó 'Ábhar' > 'Ailt' > 'Roghanna' > cluaisín 'Comhtháthú' socraigh 'Cumasaigh sreabhadh oibre' go 'Tá'</li><li>Sábháil athruithe</li></ol><p>Nuair a rochtain tú 'Ábhar' arís feicfidh tú an rannán 'Sreafaí Oibre'.</p><p>Nuair a chuireann tú alt in eagar feicfidh tú na haistrithe nua d'altanna a bhaineann le sreafaí oibre freisin.</p>"
