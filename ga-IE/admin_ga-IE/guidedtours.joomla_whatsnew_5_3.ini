COM_GUIDEDTOURS_TOUR_WHATSNEW_5_3_DESCRIPTION="<h1 class=\"fw-medium\">Fáilte go Joomla 5.3!</h1><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Nuashonruithe ar Thurais Treoraithe</h2><p>Tá a API féin ag Turais Treoraithe anois. <a href=\"https://manual.joomla.org/docs/next/web-services-api/\" target=\"_blank\" rel=\"noopener noreferrer\">Doiciméadú API Joomla</a></p><p>Fan le haghaidh feabhsuithe nua eile atá ag teacht go luath!</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_3/filesdirectory.jpg\" alt=\"An chéad chéim den turas fáilte, ag taispeáint an fillteán nua comhaid meán\" width=\"521\" height=\"304\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Nuashonruithe Lárnacha</h2><h3 class=\"mb-3\">Eagraigh Comhaid ina Suíomh Féin</h3><p>Ansin is féidir leat doiciméid stóráilte/uaslódáilte a fheiceáil agus a roghnú go díreach ón mBainisteoir Meán. Faigh tuilleadh eolais sa <a href=\"https://magazine.joomla.org/all-issues/december-2024/document-uploads-on-your-joomla-website\" target=\"_blank\" rel=\"noopener noreferrer\">Iris Pobail Joomla</a>.</p><h3 class=\"mb-3\">Féach Stair Tascanna Sceidealta</h3><p>Tá an cumas agat anois faisnéis feidhmithe a fheiceáil go díreach sa chúlra gan comhaid loga a rochtain. Féach ar an gcnaipe <strong>Stair Feidhmithe</strong> atá suite ar an leathanach Tascanna Sceidealta.</p><h3>Feabhsuithe agus Deisiúcháin Eile</h3><ul class=\"mb-3\"><li>Comparáid Breiseán Forghníomhaithe Teimpléid - cuireann sé feidhmiúlacht comparáide le forghníomhaithe breiseán</li><li>Deisíodh Cuardach Ailias Clibe - anois in ionad uimhir aitheantais na clibe a thaispeáint sa URL taispeántar ainm na clibe</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_5_3_TITLE="Cad atá Nua i Joomla 5.3!"
