PLG_SYSTEM_WEBAUTHN="Córas - Logáil Isteach Gan Focal Faire (Passkey)"
PLG_SYSTEM_WEBAUTHN_CANNOT_ADD_FOR_A_USER="Ní féidir leat eochracha pas a chur leis nó a bhaint thar ceann úsáideoirí. Caithfidh úsáideoirí logáil isteach, agus a gcuid feistí féin a chur ar bun."
PLG_SYSTEM_WEBAUTHN_DESCRIPTION="Cumasaíonn fíordheimhniú gan focal faire ag úsáid eochracha pas. Tabhair faoi deara nach mbeidh an cluaisín eochracha pas san eagarthóir próifíl úsáideora agus na cnaipí logála isteach eochracha pas le feiceáil ach amháin má tá an t-úsáideoir ag rochtain an tsuímh thar HTTPS. Ní oibreoidh clárú eochracha pas agus iad a úsáid chun logáil isteach ar do shuíomh ach amháin nuair a bhíonn do shuíomh ag úsáid deimhniú bailí, sínithe ag Údarás Deimhnithe a bhfuil muinín ag brabhsálaí an úsáideora as."
PLG_SYSTEM_WEBAUTHN_ERR_AJAX_INVALIDACTION="Gníomh ajax neamhbhailí"
PLG_SYSTEM_WEBAUTHN_ERR_CANNOT_FIND_USERNAME="Ní féidir an réimse ainm úsáideora a aimsiú sa mhodúl logála isteach. Tá brón orm, ní oibreoidh fíordheimhniú gan focal faire ar an suíomh seo mura n-úsáideann tú modúl logála isteach difriúil."
PLG_SYSTEM_WEBAUTHN_ERR_CANT_STORE_FOR_GUEST="Ní féidir creidiúnais a stóráil do Úsáideoir Aoi!"
PLG_SYSTEM_WEBAUTHN_ERR_CORRUPT_STORED_CREDENTIAL="Tá na creidiúnais stóráilte truaillithe do do chuntas úsáideora. Logáil isteach ag úsáid modh eile, ansin bain agus cuir arís do eochair pas."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Iarratas logála isteach gan focal faire neamhbhailí. Tá rud éigin briste nó is iarracht é seo an suíomh a hackáil."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_PK="Theip ar chlárú eochair pas. Ní hionann an freagra eochair pas a fuarthas ón mbrabhsálaí agus an Eochair Phoiblí a d'eisigh an freastalaí. Ciallaíonn sé seo gur iarracht duine tú a hackáil nó go bhfuil rud éigin briste."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_USER="Ar chúiseanna slándála níl cead agat eochracha pas a chlárú thar ceann úsáideora eile."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Chuaigh rud éigin mícheart ach níl tuilleadh faisnéise faoin earráid ar fáil ag an am seo. Déan iarracht do eochair pas a chlárú arís."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_PK="Níor eisigh an freastalaí Eochair Phoiblí le haghaidh clárú eochair pas ach ar bhealach éigin fuair sé iarratas clárúcháin eochair pas ón mbrabhsálaí. Ciallaíonn sé seo gur iarracht duine tú a hackáil nó go bhfuil rud éigin briste."
PLG_SYSTEM_WEBAUTHN_ERR_CREDENTIAL_ID_ALREADY_IN_USE="Ní féidir creidiúnais a shábháil. Tá na creidiúnais seo á n-úsáid cheana féin ag úsáideoir difriúil."
PLG_SYSTEM_WEBAUTHN_ERR_EMPTY_USERNAME="Ní mór duit d'ainm úsáideora a iontráil (ach NÍ do phasfhocal) sula roghnaíonn tú an cnaipe logála isteach eochair pas."
PLG_SYSTEM_WEBAUTHN_ERR_INVALID_USERNAME="Ní fhreagraíonn an t-ainm úsáideora sonraithe do chuntas úsáideora a bhfuil logáil isteach gan focal faire cumasaithe aige ar an suíomh seo."
PLG_SYSTEM_WEBAUTHN_ERR_LABEL_NOT_SAVED="Níorbh fhéidir an lipéad nua a shábháil"
PLG_SYSTEM_WEBAUTHN_ERR_NOT_DELETED="Níorbh fhéidir an eochair pas a bhaint"
PLG_SYSTEM_WEBAUTHN_ERR_NOUSER="Níor aimsíodh aon chuntas úsáideora"
PLG_SYSTEM_WEBAUTHN_ERR_NO_BROWSER_SUPPORT="Tá brón orm, níl tacaíocht ag do bhrabhsálaí don chaighdeán eochracha pas le haghaidh logálacha isteach gan focal faire nó níl do shuíomh á sheirbheáil thar HTTPS le deimhniú bailí, sínithe ag Údarás Deimhnithe a bhfuil muinín ag do bhrabhsálaí as. Beidh ort logáil isteach ar an suíomh seo ag úsáid d'ainm úsáideora agus do phasfhocal."
PLG_SYSTEM_WEBAUTHN_ERR_NO_STORED_CREDENTIAL="Ní féidir na creidiúnais stóráilte do do eochair pas a aimsiú."
PLG_SYSTEM_WEBAUTHN_ERR_USER_REMOVED="Is cosúil nach bhfuil an t-úsáideoir don eochair pas seo ann níos mó ar an suíomh seo."
PLG_SYSTEM_WEBAUTHN_ERR_XHR_INITCREATE="Ní féidir an fhaisnéis chlárúcháin eochair pas a fháil ó do shuíomh."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_DESC="Ná ceadaigh ach eochracha pas le sínithe criptigrafacha inaitheanta a úsáid le haghaidh logálacha eochair pas. Moltar go láidir é le haghaidh timpeallachtaí ardshlándála. Éilíonn sé go bhfuil an eolaire sealadach córais in-scríofa ag PHP, agus an síneadh OpenSSL. D’fhéadfadh sé cosc a chur ar roinnt eochracha pas níos saoire, neamh-dheimhnithe oibriú ar chor ar bith. Má dhíchumasaítear é, cuireann sé cosc ar Joomla freisin ó bheith in ann an cineál agus an tsamhail den eochair pas atá á úsáid agat a aithint (ní thaispeánfar aon deilbhín in aice le hAinm na heochrach pas)."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_LABEL="Tacaíocht Fhianaise"
PLG_SYSTEM_WEBAUTHN_FIELD_DESC="Ligeann sé duit modhanna logála isteach gan phasfhocal a bhainistiú ag úsáid eochracha pas. Teastaíonn brabhsálaí agus eochair pas tacaíochta uait (m.sh. Google Chrome nó Firefox le heochair slándála deimhnithe FIDO2).<br><br><strong>MacOS/iOS/watchOS:</strong> Aitheantas Teagmhála/Aghaidh.<br><strong>Windows:</strong> Hello (Aitheantas Méarlorg / Aghaidh / PIN).<br><strong>Android:</strong> Glas scáileáin bithmhéadrach.<br><br>Is féidir leat tuilleadh sonraí a fháil sa <a href=\"https://docs.joomla.org/Special:MyLanguage/WebAuthn_Passwordless_Login\" target=\"_blank\" rel=\"noopener noreferrer\">doiciméadacht Logáil Isteach Gan Pasfhocal Eochair Pas</a>."
