PLG_SYSTEM_WEBAUTHN_LOGIN_DESC="Logáil isteach gan pasfhocal ag úsáid an chaighdeáin eochair pas brabhsálaí i mbrabhsálaithe comhoiriúnacha. Ní mór duit fíordheimhniú eochair pas a bheith socraithe cheana féin i do phróifíl úsáideora."
