PLG_SYSTEM_JOOA11Y_LINK_URL="D'fhéadfadh go mbeadh sé deacair URLanna níos faide, nach bhfuil chomh hintuigthe, a úsáid mar théacs nasc le teicneolaíocht chúnta. I bhformhór na gcásanna, is fearr téacs atá inléite ag daoine a úsáid in ionad an URL. Tá URLanna gearra (cosúil le leathanach baile an tsuímh) ceart go leor."
PLG_SYSTEM_JOOA11Y_LINK_URL_TIP="<strong>Leid!</strong> Ba chóir go mbeadh téacs an naisc soiléir, uathúil, agus bríomhar i gcónaí ionas go bhféadfaí é a thuiscint as comhthéacs."
