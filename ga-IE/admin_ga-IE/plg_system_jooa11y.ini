PLG_SYSTEM_JOOA11Y_QA_FAKE_HEADING_INFO="D'fhéadfadh go mbeadh líne de théacs trom cosúil le ceannteideal, ach ní féidir le duine ag úsáid léitheoir scáileáin a rá go bhfuil sé tábhachtach nó léim chuig a ábhar. Níor chóir go n-athsholáthródh téacs trom ceannteidil séimeantacha riamh (Ceannteideal 2 go Ceannteideal 6)."
PLG_SYSTEM_JOOA11Y_QA_PAGE_LANGUAGE_MESSAGE="Teanga an leathanaigh gan dearbhú! <a href=\"https://www.w3.org/International/questions/qa-html-language-declarations\" target=\"_blank\" rel=\"noopener noreferrer\">Dearbhaigh teanga ar an gclib HTML le do thoil.</a>"
PLG_SYSTEM_JOOA11Y_QA_PDF_COUNT="Meastar go bhfuil PDFs mar ábhar gréasáin agus caithfear iad a dhéanamh inrochtana freisin. Is minic a bhíonn fadhbanna ag PDFs do dhaoine a úsáideann léitheoirí scáileáin (clibeanna struchtúracha in easnamh nó lipéid réimse foirme in easnamh) agus do dhaoine a bhfuil fís íseal acu (ní athraíonn an téacs nuair a mhéadaítear é). <ul><li>Má tá sé seo ina fhoirm, smaoinigh ar fhoirm HTML inrochtana a úsáid mar mhalairt.</li><li>Má tá sé seo ina dhoiciméad, smaoinigh ar é a thiontú ina leathanach gréasáin.</li></ul><br>Seachas sin, seiceáil le do thoil <strong>%(pdfCount)</strong> <a href=\"https://www.adobe.com/accessibility/products/acrobat/using-acrobat-pro-accessibility-checker.html\" target=\"_blank\" rel=\"noopener noreferrer\">PDF(anna) le haghaidh inrochtaineachta in Acrobat DC.</a>"
PLG_SYSTEM_JOOA11Y_QA_SHOULD_BE_LIST="An bhfuil tú ag iarraidh liosta a chruthú? Mír liosta féideartha aimsithe: <strong>%(firstPrefix)</strong>"
PLG_SYSTEM_JOOA11Y_QA_SHOULD_BE_LIST_TIP="Déan cinnte go n-úsáideann tú liostaí séimeantacha trí úsáid a bhaint as na cnaipí formáidithe piléar nó uimhreach ina ionad. Nuair a úsáidtear liosta séimeantach, tá teicneolaíochtaí cúnta in ann faisnéis a chur in iúl mar an líon iomlán míreanna agus suíomh coibhneasta gach mír sa liosta. Foghlaim níos mó faoi <a href=\"https://www.w3.org/WAI/tutorials/page-structure/content/#lists\" target=\"_blank\" rel=\"noopener noreferrer\">liostaí séimeantacha.</a>"
PLG_SYSTEM_JOOA11Y_QA_UPPERCASE_WARNING="Aimsíodh gach ceannlitir. D'fhéadfadh roinnt léitheoirí scáileáin gach téacs i gceannlitreacha a léirmhíniú mar acrainm agus léifidh siad gach litir ina n-aonar. Ina theannta sin, faigheann roinnt daoine gach ceannlitir níos deacra le léamh agus d'fhéadfadh sé cuma SHOUTING a thabhairt."
