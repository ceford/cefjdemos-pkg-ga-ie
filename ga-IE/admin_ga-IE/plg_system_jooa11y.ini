PLG_SYSTEM_JOOA11Y_QA_BAD_ITALICS="Tá brí shéimeantach ag clibeanna troma agus iodálacha, agus níor cheart iad a úsáid chun míreanna iomlána a aibhsiú. Ba chóir téacs trom a úsáid chun béim láidir a chur ar fhocal nó frása. Ba chóir iodálacha a úsáid chun ainmneacha cearta a aibhsiú (i.e. teidil leabhar agus alt), focail iasachta, luachana. Ba chóir luachana fada a fhormáidiú mar bhlocluachana."
PLG_SYSTEM_JOOA11Y_QA_BAD_LINK="Droch nasc aimsithe. Dealraíonn sé go bhfuil an nasc ag díriú ar thimpeallacht forbartha. Tá an nasc seo ag díriú ar: <strong>%(el)</strong>"
