PLG_SYSTEM_JOOA11Y_CONTRAST="Codarsnacht"
PLG_SYSTEM_JOOA11Y_CONTRAST_ERROR_INPUT_MESSAGE="Níl go leor codarsnachta ag an téacs laistigh den ionchur seo leis an gcúlra. Ba chóir go mbeadh an cóimheas codarsnachta ar a laghad 4.5:1 do ghnáth-théacs agus 3:1 do théacs mór."
PLG_SYSTEM_JOOA11Y_CONTRAST_ERROR_INPUT_MESSAGE_INFO="Is é an cóimheas codarsnachta <strong>%(cratio)</strong>."
PLG_SYSTEM_JOOA11Y_CONTRAST_ERROR_MESSAGE="Níl go leor codarsnachta ag an téacs seo leis an gcúlra. Ba chóir go mbeadh an cóimheas codarsnachta ar a laghad 4.5:1 do ghnáth-théacs agus 3:1 do théacs mór."
PLG_SYSTEM_JOOA11Y_CONTRAST_ERROR_MESSAGE_INFO="Is é an cóimheas codarsnachta <strong>%(cratio)</strong> don téacs seo a leanas: <strong>%(nodetext)</strong>"
PLG_SYSTEM_JOOA11Y_CONTRAST_WARNING_MESSAGE="Tá codarsnacht an téacs seo anaithnid agus ní mór é a athbhreithniú de láimh. Déan cinnte go bhfuil dathanna láidre codarsnachta ag an téacs agus an cúlra. Ba chóir go mbeadh an cóimheas codarsnachta ar a laghad 4.5:1 do ghnáth-théacs agus 3:1 do théacs mór."
PLG_SYSTEM_JOOA11Y_CONTRAST_WARNING_MESSAGE_INFO="Athbhreithnigh codarsnacht an téacs seo a leanas le do thoil:<br><strong>%(nodetext)</strong>"
PLG_SYSTEM_JOOA11Y_DARK_MODE="Mód Dorcha"
PLG_SYSTEM_JOOA11Y_DIFFICULT_READABILITY="Deacair"
PLG_SYSTEM_JOOA11Y_EMBED_AUDIO="Déan cinnte le do thoil tras-scríbhinn a sholáthar do <strong>gach podchraoladh.</strong> Is riachtanas éigeantach Leibhéal A é tras-scríbhinní a sholáthar do ábhar fuaime. Tacaíonn tras-scríbhinní le daoine atá Bodhar nó a bhfuil lagéisteacht orthu, ach is féidir le gach duine tairbhe a bhaint astu. Smaoinigh ar an tras-scríbhinn a chur thíos nó laistigh de phainéal accordion."
PLG_SYSTEM_JOOA11Y_EMBED_GENERAL_WARNING="Ní féidir ábhar leabaithe a sheiceáil. Déan cinnte le do thoil go bhfuil téacs alt ag íomhánna, go bhfuil fotheidil ag físeáin, go bhfuil codarsnacht leordhóthanach ag téacs, agus go bhfuil comhpháirteanna idirghníomhacha <a href=\"https://webaim.org/techniques/keyboard/\" target=\"_blank\" rel=\"noopener noreferrer\">inrochtana le méarchlár.</a>"
PLG_SYSTEM_JOOA11Y_EMBED_MISSING_TITLE="Teastaíonn ainm inrochtana ó ábhar leabaithe a chuireann síos ar a ábhar. Soláthair <span class=\"jooa11y-kbd\">teideal</span> uathúil nó tréith <span class=\"jooa11y-kbd\">aria-label</span> ar an eilimint <span class=\"jooa11y-kbd\">iframe</span> le do thoil. Foghlaim níos mó faoi <a href=\"https://dequeuniversity.com/tips/provide-iframe-titles\" target=\"_blank\" rel=\"noopener noreferrer\">iFrames.</a>"
PLG_SYSTEM_JOOA11Y_EMBED_VIDEO="Déan cinnte le do thoil go bhfuil <strong>fotheidil dúnta ag gach físeán.</strong> Is riachtanas éigeantach Leibhéal A é fotheidil a sholáthar do gach ábhar fuaime agus físe. Tacaíonn fotheidil le daoine atá Bodhar nó a bhfuil lagéisteacht orthu."
PLG_SYSTEM_JOOA11Y_ERROR="Earráid"
PLG_SYSTEM_JOOA11Y_FAIRLY_DIFFICULT_READABILITY="Measartha deacair"
PLG_SYSTEM_JOOA11Y_FIELD_ADDITIONAL_CHECKS="Seiceálacha Breise i gcónaí ar siúl"
PLG_SYSTEM_JOOA11Y_FIELD_ADDITIONAL_CHECKS_DESC="Má chumasaítear an rogha seo, cuirfear na lasca aistrithe do Lipéid Foirme, Codarsnacht, Naisc (Ardleibhéal) i bhfolach go radhairc sa phainéal Socruithe."
PLG_SYSTEM_JOOA11Y_FIELD_COLOUR_FILTER="Scagaire Datha"
PLG_SYSTEM_JOOA11Y_FIELD_COLOUR_FILTER_DESC="Taispeáin lasc Scagaire Datha sa phainéal Socruithe. Cabhraíonn scagairí datha le teaglaim dathanna a aithint a d'fhéadfadh a bheith deacair do dhaoine a idirdhealú."
PLG_SYSTEM_JOOA11Y_FIELD_CONTRAST="Codarsnacht"
PLG_SYSTEM_JOOA11Y_FIELD_CONTRAST_DESC="Taispeáin lasc Codarsnachta sa phainéal Socruithe. Seiceáil le haghaidh saincheisteanna codarsnachta Leibhéal AA WCAG 2.0 idir téacs tosaigh agus eilimintí cúlra."
PLG_SYSTEM_JOOA11Y_FIELD_FORM_LABELS="Lipéid Foirme"
PLG_SYSTEM_JOOA11Y_FIELD_FORM_LABELS_DESC="Taispeáin lasc Lipéid Foirme sa phainéal Socruithe. Seiceáil le haghaidh ionchuir foirme atá in easnamh ar lipéad comhfhreagrach. Ní gá go bhfuil sé seo ina cheist d'údar ábhair, agus de ghnáth ní ceist é nuair a úsáidtear breiseán foirmeanna inrochtana iontaofa."
PLG_SYSTEM_JOOA11Y_FIELD_LINKS_ADVANCED="Naisc (Ardleibhéal)"
PLG_SYSTEM_JOOA11Y_FIELD_LINKS_ADVANCED_DESC="Taispeáin lasc Naisc (Ardleibhéal) sa phainéal Socruithe. Seiceáil le haghaidh saincheisteanna breise mar: naisc a osclaíonn i gcluaisín nua gan rabhadh, a bhfuil ainmneacha comhionanna acu ach cuspóir difriúil, nó a thagraíonn do PDF agus comhaid eile gan rabhadh."
PLG_SYSTEM_JOOA11Y_FIELD_WEB_COMPONENTS="Comhpháirteanna Gréasáin le Seiceáil"
PLG_SYSTEM_JOOA11Y_FIELD_WEB_COMPONENTS_DESC="Soláthair liosta de na comhpháirteanna gréasáin nó coimeádáin ar fad atá ar eolas le DOM scáth oscailte."
PLG_SYSTEM_JOOA11Y_FILE_TYPE_WARNING="Déanann an nasc pointeáil chuig comhad PDF nó comhad in-íoslódáilte (m.sh. MP3, Zip, Word Doc) gan rabhadh. Léirigh an cineál comhaid laistigh de théacs an naisc. Má tá sé ina chomhad mór, smaoinigh ar an méid comhaid a áireamh."
PLG_SYSTEM_JOOA11Y_FILE_TYPE_WARNING_TIP="<strong>Sampla:</strong> Tuarascáil Feidhmiúcháin (PDF, 3MB)"
PLG_SYSTEM_JOOA11Y_FORM_LABELS="Lipéid foirme"
PLG_SYSTEM_JOOA11Y_GOOD="Maith"
PLG_SYSTEM_JOOA11Y_GOOD_READABILITY="Maith"
PLG_SYSTEM_JOOA11Y_HEADING_EMPTY="Ceanntásc folamh aimsithe! Chun é a shocrú, scrios an líne seo nó athraigh a fhormáid ó <strong>Ceanntásc %(level)</strong> go <strong>Gnáth</strong> nó <strong>Alt</strong>."
PLG_SYSTEM_JOOA11Y_HEADING_EMPTY_WITH_IMAGE="Níl aon téacs sa cheanntásc, ach tá íomhá ann. Mura ceanntásc é seo, athraigh a fhormáid ó <strong>Ceanntásc %(level)</strong> go <strong>Gnáth</strong> nó <strong>Alt</strong>. Seachas sin, cuir téacs malartach leis an íomhá mura bhfuil sé maisiúil."
PLG_SYSTEM_JOOA11Y_HEADING_FIRST="Ba cheart go mbeadh an chéad cheanntásc ar leathanach de ghnáth mar Cheanntásc 1 nó Ceanntásc 2. Ba cheart go mbeadh Ceanntásc 1 mar thús an phríomh-ábhar, agus is é an príomhcheanntásc a chuireann síos ar chuspóir foriomlán an leathanaigh. Foghlaim níos mó faoi <a href=\"https://www.w3.org/WAI/tutorials/page-structure/headings/\" target=\"_blank\" rel=\"noopener noreferrer\">Struchtúr Ceanntásca.</a>"
PLG_SYSTEM_JOOA11Y_HEADING_LONG="Tá an ceanntásc fada! Ba cheart ceanntásca a úsáid chun ábhar a eagrú agus struchtúr a chur in iúl. Ba cheart go mbeadh siad gairid, faisnéiseach, agus uathúil. Coinnigh ceanntásca níos lú ná 160 carachtar (níos mó ná abairt amháin)."
PLG_SYSTEM_JOOA11Y_HEADING_LONG_INFO="Líon Carachtair: <strong>%(headingLength)</strong>."
PLG_SYSTEM_JOOA11Y_HEADING_MISSING_ONE="Ceanntásc 1 ar iarraidh. Ba cheart go mbeadh Ceanntásc 1 mar thús an phríomh-ábhar, agus is é an príomhcheanntásc a chuireann síos ar chuspóir foriomlán an leathanaigh. Foghlaim níos mó faoi <a href=\"https://www.w3.org/WAI/tutorials/page-structure/headings/\" target=\"_blank\" rel=\"noopener noreferrer\">Struchtúr Ceanntásca.</a>"
PLG_SYSTEM_JOOA11Y_HEADING_NON_CONSECUTIVE_LEVEL="Leibhéal ceanntásca neamhleanúnach in úsáid. Níor cheart ceanntásca a scipeáil riamh, nó dul ó <strong>Ceanntásc %(prevLevel)</strong> go <strong>Ceanntásc %(level)</strong>."
PLG_SYSTEM_JOOA11Y_HIDE_OUTLINE="Folaigh Imlíne"
PLG_SYSTEM_JOOA11Y_HIDE_SETTINGS="Folaigh Socruithe"
PLG_SYSTEM_JOOA11Y_HYPERLINK_ALT_LENGTH_MESSAGE="Tá an cur síos téacs malartach ar íomhá nasctha <strong>ró-fhada</strong>. Ba cheart go gcuirfeadh an téacs malartach ar íomhánna nasctha síos ar an áit a dtugann an nasc thú, ní cur síos litriúil ar an íomhá. <strong>Smaoinigh ar theideal an leathanaigh a nascann sé leis a úsáid mar an téacs malartach.</strong>"
PLG_SYSTEM_JOOA11Y_HYPERLINK_ALT_LENGTH_MESSAGE_INFO="Tá an téacs malartach <strong>%(altLength)</strong> carachtair: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_IMAGE_FIGURE_DECORATIVE="Tá an íomhá marcáilte mar <strong>maisiúil</strong> agus beidh sé neamhaird ag teicneolaíocht chúnta."
PLG_SYSTEM_JOOA11Y_IMAGE_FIGURE_DECORATIVE_INFO="Cé go raibh <strong>fotheidil</strong> curtha ar fáil, ba cheart go mbeadh téacs malartach ag an íomhá i bhformhór na gcásanna. <ul><li>Ba cheart go gcuirfeadh an téacs malartach síos go hachomair ar a bhfuil san íomhá.</li><li>Ba cheart go gcuirfeadh an fotheideal comhthéacs ar fáil de ghnáth chun an íomhá a bhaineann leis an ábhar máguaird, nó aird a tharraingt ar phíosa áirithe faisnéise.</li></ul> Foghlaim níos mó: <a href=\"https://thoughtbot.com/blog/alt-vs-figcaption#the-figcaption-element\" target=\"_blank\" rel=\"noopener noreferrer\">alt i gcoinne figcaption.</a>"
PLG_SYSTEM_JOOA11Y_IMAGE_FIGURE_DUPLICATE_ALT="Ná húsáid na focail chéanna go díreach don téacs alt agus don téacs fotheideal. Fógróidh léitheoirí scáileáin an t-eolas faoi dhó."
PLG_SYSTEM_JOOA11Y_LABELS_ARIA_LABEL_INPUT_MESSAGE="Tá ainm inrochtana ag an ionchur, ach déan cinnte go bhfuil lipéad infheicthe ann freisin."
PLG_SYSTEM_JOOA11Y_LABELS_ARIA_LABEL_INPUT_MESSAGE_INFO="Is é an t-ainm inrochtana don ionchur seo: <strong>%(ariaLabel)</strong>"
PLG_SYSTEM_JOOA11Y_LABELS_INPUT_RESET_MESSAGE="Níor cheart cnaipí athshocraithe a úsáid <strong>mura</strong> bhfuil gá leo go sonrach mar go bhfuil siad éasca le gníomhachtú trí dhearmad."
PLG_SYSTEM_JOOA11Y_LABELS_INPUT_RESET_MESSAGE_TIP="<strong>Leid!</strong> Foghlaim cén fáth a mbíonn saincheisteanna inúsáidteachta ag cnaipí <a href=\"https://www.nngroup.com/articles/reset-and-cancel-buttons/\" target=\"_blank\" rel=\"noopener noreferrer\">Athshocraithe agus Cealaigh</a>."
PLG_SYSTEM_JOOA11Y_LABELS_MISSING_IMAGE_INPUT_MESSAGE="Tá téacs alt in easnamh ar an gcnaipe íomhá. Cuir téacs alt leis chun ainm inrochtana a sholáthar. Mar shampla: <em>Cuardaigh</em> nó <em>Seol</em>."
PLG_SYSTEM_JOOA11Y_LABELS_MISSING_LABEL_MESSAGE="Níl aon lipéad bainteach leis an ionchur seo. Cuir <span class=\"jooa11y-kbd\">id</span> leis an ionchur seo, agus cuir tréith <span class=\"jooa11y-kbd\">for</span> a mheaitseálann leis an lipéad."
PLG_SYSTEM_JOOA11Y_LABELS_NO_FOR_ATTRIBUTE_MESSAGE="Níl aon lipéad bainteach leis an ionchur seo. Cuir tréith <span class=\"jooa11y-kbd\">for</span> leis an lipéad a mheaitseálann le <span class=\"jooa11y-kbd\">id</span> an ionchuir seo."
PLG_SYSTEM_JOOA11Y_LABELS_NO_FOR_ATTRIBUTE_MESSAGE_INFO="Is é an ID don ionchur seo: <strong>id=&#34;%(t)&#34;</strong>"
PLG_SYSTEM_JOOA11Y_LANG_CODE="ga"
PLG_SYSTEM_JOOA11Y_LINK_ALT_HAS_BAD_WORD_MESSAGE="Aimsíodh síneadh comhaid laistigh den téacs alt. Má tá an íomhá ag tabhairt scéil, giúmar, nó eolas tábhachtach - bí cinnte cur síos a dhéanamh ar an íomhá."
PLG_SYSTEM_JOOA11Y_LINK_ALT_HAS_BAD_WORD_MESSAGE_INFO="Bain: <strong>%(error)</strong>.<br>Is é an téacs alt don íomhá seo: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_ALT_HAS_SUS_WORD_MESSAGE="Tugann teicneolaíochtaí cúnta le fios cheana féin gur íomhá é seo, mar sin d'fhéadfadh &quot;<strong>%(error)</strong>&quot; nó &quot;%(error) de&quot; a bheith iomarcach."
PLG_SYSTEM_JOOA11Y_LINK_ALT_HAS_SUS_WORD_MESSAGE_INFO="Is é an téacs alt don íomhá seo: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_ALT_PLACEHOLDER_MESSAGE="Aimsíodh téacs alt neamhshonrach nó sealadach. Cuir an téacs alt seo in ionad rud éigin níos bríomhaire: <strong>%(altText)</strong>."
PLG_SYSTEM_JOOA11Y_LINK_ALT_TOO_LONG_MESSAGE="Tá cur síos ar an téacs alt <strong>ró-fhada</strong>. Ba chóir go mbeadh téacs alt gonta, ach bríomhar cosúil le <em>tweet</em> (thart ar 100 carachtar). Má tá íomhá chasta nó graf ann, smaoinigh ar an gcur síos fada ar an íomhá a chur sa téacs thíos nó i gcomhpháirt accordeon."
PLG_SYSTEM_JOOA11Y_LINK_ALT_TOO_LONG_MESSAGE_INFO="Tá an téacs alt <strong>%(altLength)</strong> carachtar: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_ANCHOR_LINK_AND_ALT_MESSAGE="Tá <strong>téacs alt agus téacs nasc máguaird</strong> ag nasc íomhá. Má tá an íomhá seo maisiúil agus á húsáid mar nasc feidhmiúil chuig leathanach eile, smaoinigh ar an íomhá a mharcáil mar mhaisiúil - ba cheart go mbeadh an téacs nasc máguaird sách maith."
PLG_SYSTEM_JOOA11Y_LINK_ANCHOR_LINK_AND_ALT_MESSAGE_INFO="Téacs alt: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_BEST_PRACTICES="Smaoinigh ar an téacs nasc a athsholáthar: <strong>%(error)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_BEST_PRACTICES_DETAILS="<ul><li>Cuireann &quot;Cliceáil anseo&quot; béim ar mheicnic an luch, nuair nach n-úsáideann go leor daoine luch nó b'fhéidir go bhfuil siad ag féachaint ar an suíomh gréasáin seo ar ghléas soghluaiste. Smaoinigh ar bhriathar difriúil a úsáid a bhaineann leis an tasc.</li><li>Seachain siombailí HTML a úsáid mar ghlaonna chun gnímh mura bhfuil siad ceilte ó theicneolaíochtaí cúnta.</li></ul>"
PLG_SYSTEM_JOOA11Y_LINK_DECORATIVE_MESSAGE="Tá an íomhá marcáilte mar <strong>maisitheach</strong> agus déanfaidh teicneolaíocht chúnta neamhaird uirthi. Má tá scéal, giúmar nó faisnéis thábhachtach á chur in iúl ag an íomhá - bí cinnte téacs malartach a chur leis."
PLG_SYSTEM_JOOA11Y_LINK_EMPTY="Bain naisc fholmha gan aon téacs."
PLG_SYSTEM_JOOA11Y_LINK_EMPTY_LINK_NO_LABEL="Níl téacs sainiúil ag an nasc atá le feiceáil do léitheoirí scáileáin agus teicneolaíocht chúnta eile. Chun é a shocrú:<ul><li>Cuir roinnt téacs gonta leis a chuireann síos ar an áit a dtugann an nasc thú.</li><li>Mura <a href=\"https://a11y-101.com/development/icons-and-links\" target=\"_blank\" rel=\"noopener noreferrer\">nasc deilbhín nó SVG</a> é, is dócha go bhfuil lipéad tuairisciúil in easnamh air.</li><li>Mura gceapann tú gur earráid é an nasc seo mar gheall ar bhotún cóipeála/greamaigh, smaoinigh ar é a scriosadh.</li></ul>"
PLG_SYSTEM_JOOA11Y_LINK_HYPERLINKED_IMAGE_ARIA_HIDDEN="Tá <span class=\"jooa11y-kbd\">aria-hidden=&quot;true&quot;</span> ag an nasc timpeall ar an íomhá ach tá sé fós inrochtana ag méarchlár. Má tá sé ar intinn agat nasc iomarcach nó dúblach a cheilt, cuir <span class=\"jooa11y-kbd\">tabindex=&quot;-1&quot;</span> leis freisin."
PLG_SYSTEM_JOOA11Y_LINK_IDENTICAL_NAME="Tá téacs comhionann ag an nasc le nasc eile, cé go dtagraíonn sé do leathanach difriúil. D'fhéadfadh mearbhall a bheith ar dhaoine a úsáideann léitheoirí scáileáin mar gheall ar iliomad nasc leis an téacs céanna."
PLG_SYSTEM_JOOA11Y_LINK_IDENTICAL_NAME_TIP="Smaoinigh ar an nasc seo a leanas a dhéanamh níos tuairisciúla chun cabhrú leis a idirdhealú ó naisc eile: <strong>%(linkText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_BAD_ALT_MESSAGE="Aimsíodh síneadh comhaid laistigh den téacs malartach. Déan cinnte go gcuireann an téacs malartach síos ar cheann scríbe an naisc, ní cur síos litriúil ar an íomhá. Bain: <strong>%(error)</strong>."
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_BAD_ALT_MESSAGE_INFO="Is é an téacs malartach don íomhá seo: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_LINK_ALT_TEXT_MESSAGE="Tá téacs malartach ag nasc íomhá, cé go bhfuil sé le do thoil a chinntiú go gcuireann an téacs malartach síos ar an leathanach ceann scríbe. <strong>Smaoinigh ar theideal an leathanaigh a nascann sé leis a úsáid mar an téacs malartach.</strong> An gcuireann an téacs malartach síos ar an áit a dtugann an nasc thú?"
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_LINK_ALT_TEXT_MESSAGE_INFO="Téacs malartach: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_LINK_NULL_ALT_NO_TEXT_MESSAGE="Tá an íomhá laistigh den nasc marcáilte mar mhaisitheach agus níl aon téacs nasc ann. Cuir téacs malartach leis an íomhá a chuireann síos ar cheann scríbe an naisc."
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_PLACEHOLDER_ALT_MESSAGE="Aimsíodh téacs malartach neamhshonrach nó sealadach laistigh d'íomhá nasctha. Déan cinnte go gcuireann an téacs malartach síos ar cheann scríbe an naisc, ní cur síos litriúil ar an íomhá. Cuir an téacs malartach seo a leanas in ionad: <strong>%(altText)</strong>."
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_SUS_ALT_MESSAGE="Tugann teicneolaíochtaí cúnta le fios cheana féin gur íomhá é seo, mar sin d'fhéadfadh &quot;<strong>%(error)</strong>&quot; nó &quot;%(error) de&quot; a bheith iomarcach. Déan cinnte go gcuireann an téacs malartach síos ar cheann scríbe an naisc, ní cur síos litriúil ar an íomhá."
