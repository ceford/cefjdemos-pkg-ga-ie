PLG_SYSTEM_JOOA11Y_TABLES_EMPTY_HEADING="Ceanntásc tábla folamh aimsithe! Níor cheart go mbeadh ceanntásca tábla <em>riamh</em> folamh. Tá sé tábhachtach ceanntásca sraithe agus/nó colúin a ainmniú chun a gcaidreamh a chur in iúl. Soláthraíonn an fhaisnéis seo comhthéacs do dhaoine a úsáideann teicneolaíocht chúnta. Cuimhnigh le do thoil gur cheart táblaí a úsáid le haghaidh sonraí tábla amháin."
PLG_SYSTEM_JOOA11Y_TABLES_EMPTY_HEADING_INFO="Foghlaim níos mó faoi <a href=\"https://www.w3.org/WAI/tutorials/tables/\" target=\"_blank\" rel=\"noopener noreferrer\">táblaí inrochtana.</a>"
PLG_SYSTEM_JOOA11Y_TABLES_MISSING_HEADINGS="Ceanntásca tábla in easnamh! Teastaíonn marcáil HTML ó tháblaí inrochtana a léiríonn cealla ceanntásca agus cealla sonraí a shainíonn a gcaidreamh. Soláthraíonn an fhaisnéis seo comhthéacs do dhaoine a úsáideann teicneolaíocht chúnta. Ba cheart táblaí a úsáid le haghaidh sonraí tábla amháin."
PLG_SYSTEM_JOOA11Y_TABLES_MISSING_HEADINGS_INFO="Foghlaim níos mó faoi <a href=\"https://www.w3.org/WAI/tutorials/tables/\" target=\"_blank\" rel=\"noopener noreferrer\">táblaí inrochtana.</a>"
PLG_SYSTEM_JOOA11Y_TABLES_SEMANTIC_HEADING="Níor cheart ceanntásca séimeantacha mar Cheanntásc 2 nó Ceanntásc 3 a úsáid ach amháin le haghaidh codanna d'ábhar; <strong>ní</strong> i dtáblaí HTML. Léirigh ceanntásca tábla ag úsáid an eilimint <strong>th</strong> ina ionad."
