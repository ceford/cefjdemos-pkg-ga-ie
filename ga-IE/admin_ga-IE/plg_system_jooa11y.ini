PLG_SYSTEM_JOOA11Y_NEW_TAB_WARNING="Osclaíonn an nasc i gcluaisín nó fuinneog nua gan rabhadh. Is féidir go mbeidh sé mearbhall, go háirithe do dhaoine a bhfuil deacracht acu ábhar amhairc a fheiceáil. Ar an dara dul síos, ní cleachtas maith i gcónaí é taithí duine a rialú nó cinntí a dhéanamh dóibh. Léirigh go n-osclaíonn an nasc i bhfuinneog nua laistigh de théacs an naisc."
