PLG_SYSTEM_JOOA11Y="Córas - Seiceálaí Inrochtaineachta Joomla"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT="Ceantar Sprioc le Seiceáil"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT_DESC="Iontráil roghnóir aonair chun réigiún ar leith de do shuíomh gréasáin a spriocadh. Is é an socrú réamhshocraithe an sainchomhartha <strong>príomh</strong>. Is roghanna eile seachas sainchomharthaí ranganna, eilimintí nó róil ARIA (m.sh. #príomh-ábhar, .príomh, [role='main']). Iontráil <strong>corp</strong> chun an leathanach iomlán a sheiceáil."
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS="Múch Seiceálacha"
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS_DESC="Múch seiceálacha ar leith de réir ainm eochair. Foghlaim conas <a href=\"https://sa11y.netlify.app/plugins/joomla/#turn-off-checks\" target=\"_blank\" rel=\"noopener noreferrer\">Seiceálacha a Mhúchadh</a>."
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE="Réigiúin a Shéanadh"
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE_DESC="Séan réigiúin ar leith laistigh den Choimeádán Ábhair. Úsáid camóga chun ranganna nó eilimintí a scaradh (m.sh. #séan, .séan)."
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS="Airíonna Breise"
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS_DESC="Pas airíonna breise chun saincheapadh. Foghlaim conas <a href=\"https://sa11y.netlify.app/plugins/joomla/#extra-properties\" target=\"_blank\" rel=\"noopener noreferrer\">Airíonna Breise</a> a chur leis."
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT="Ceantar Sprioc Inléiteachta"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT_DESC="Sainchomhartha ar an leathanach a bheidh seiceáilte le haghaidh inléiteachta. Is é an socrú réamhshocraithe an sainchomhartha <strong>príomh</strong>."
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS="Taispeáin i gCónaí"
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS_DESC="Lódáil an seiceálaí inrochtaineachta ar gach leathanach. Tá sé seo úsáideach agus an suíomh gréasáin á fhorbairt, ach níor cheart é a fhágáil ar siúl nuair atá an suíomh gréasáin beo."
PLG_SYSTEM_JOOA11Y_KEY="Eochair"
PLG_SYSTEM_JOOA11Y_VALUE="Luach"
PLG_SYSTEM_JOOA11Y_XML_DESCRIPTION="Leagann an Seiceálaí Inrochtaineachta Joomla béim amhairc ar fhadhbanna coitianta inrochtaineachta agus inúsáidteachta. Dírithe ar údair ábhair, aithníonn an breiseán earráidí nó rabhaidh agus soláthraíonn sé treoir ar conas iad a shocrú. Tabhair faoi deara nach dtugann an breiseán seo anailís uileghabhálach ar do shuíomh gréasáin, ná ní chinntíonn sé go huathoibríoch inrochtaineacht do shuíomh gréasáin. Tá sé tábhachtach teimpléad atá inrochtana go nádúrtha a roghnú chun a chinntiú go gcomhlíonann do shuíomh caighdeáin inrochtaineachta."

