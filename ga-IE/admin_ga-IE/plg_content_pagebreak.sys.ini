PLG_CONTENT_PAGEBREAK="Ábhar - Briseadh Leathanaigh"
PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>Cead a thabhairt d'alt leathanachaithe a chruthú le tábla ábhair roghnach.</p><p>Cuir isteach bristeacha leathanaigh trí úsáid a bhaint as an gcnaipe briseadh leathanaigh atá le fáil de ghnáth i mbarra uirlisí an eagarthóra WYSIWYG. Taispeánfar suíomh an bhriste leathanaigh in alt san eagarthóir mar líne chothrománach shimplí.</p><p>Braitheann an téacs a thaispeántar ar na roghanna a roghnaítear agus féadfaidh sé a bheith ina theideal, téacs malartach (má chuirtear ar fáil é) nó uimhreacha leathanaigh.</p><p>Is é an úsáid HTML:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Teideal an leathanaigh&quot; /&gt; nó <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;An chéad leathanach&quot; /&gt; nó <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Teideal an leathanaigh&quot; alt=&quot;An chéad leathanach&quot; /&gt; nó <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;An chéad leathanach&quot; title=&quot;Teideal an leathanaigh&quot; /&gt;</p>"
