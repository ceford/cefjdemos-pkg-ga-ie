COM_GUIDEDTOURS_TOUR_ARTICLES_STEP_CATEGORY_DESCRIPTION="Roghnaigh an chatagóir don alt seo. Is féidir leat catagóir nua a iontráil freisin trí ainm a chlóscríobh sa réimse agus brúigh iontráil."

