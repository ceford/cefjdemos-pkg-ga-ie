COM_GUIDEDTOURS_TOUR_WHATSNEW_5_2_DESCRIPTION="<h1 class=\"fw-medium\">Fáilte go Joomla 5.2!</h1><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_2/enhancedtourheader.png\" alt=\"An chéad chéim den turas fáilte, ag taispeáint cuma nua an cheanntásca\" width=\"640\" height=\"384\"></div><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Nuashonruithe ar Thurais Treoraithe</h2><h3>Turasanna Tosaithe Uathoibríoch</h3><p>Ligeann an ghné seo duit do Thuras Treoraithe tosaithe uathoibríoch féin a chruthú. Is féidir an turas comhthéacsúil a roghnú amach do dhuine amháin nó do gach úsáideoir. Is féidir turais a atosú ón roghchlár Turais Treoraithe.</p><h3>Feabhsúcháin</h3><ul class=\"mb-3\"><li>Chun soiléireachta, cuireadh an <em>Comhaireamh Céime</em> ar dtús i gceanntásc an turais.</li><li>Athraíonn an fhuinneog mhodúil go huathoibríoch chun ábhar agus íomhánna níos mó a fheistiú.</li></ul></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Nuashonruithe Lárnacha</h2><h3>An modúl nua uile-i-amháin 'Ailt'</h3><p>Úsáid modúl amháin chun ailt is déanaí, is mó a léadh, ar leith nó cartlainne a thaispeáint, ó chatagóirí roghnaithe - le scagairí, clibeanna agus níos mó...</p><p>Ó <span class=\"fw-medium\">Ábhar -&gt; Modúil Suímh</span>, cruthaigh modúl nua de chineál 'Ailt'.</p><h3>Leagan Amach Teimpléad Ríomhphoist</h3><p>Tóg céim níos faide trí leagan amach uathúil iomlán a chruthú (lena n-áirítear lógó) ar féidir a chur i bhfeidhm ar theimpléid ríomhphoist amháin nó ar fad.</p><p>Ó <span class=\"fw-medium\">Cumraíocht Domhanda -&gt; Teimpléid Ríomhphoist</span>, is féidir leaganacha amach a shainiú i HTML.</p><h3>Feabhsúcháin agus Deisiúcháin Eile</h3><ul class=\"mb-3\"><li>Foirmeacha Fo-foirme Neadaithe - Ligeann sé neadú Fo-foirme laistigh de Réimse Saincheaptha Fo-foirme.</li><li>Comhaireamh Iomlán - Taispeánann sé an comhaireamh agus líon iomlán na n-ítimí liosta sa chonsól.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_2/mailtemplate.png\" alt=\"Sampla teimpléad ríomhphoist, lena n-áirítear lógó ceanntásca agus buntásc\" width=\"640\" height=\"370\" loading=\"lazy\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_5_2_TITLE="Cad atá Nua i Joomla 5.2!"
