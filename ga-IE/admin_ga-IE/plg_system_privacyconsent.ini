PLG_SYSTEM_PRIVACYCONSENT_EMAIL_REMIND_BODY="Rachaidh do Thoiliú Príobháideachais a tugadh ag {URL} in éag i gceann cúpla lá, is féidir leat an toiliú príobháideachais don suíomh gréasáin seo a athnuachan.\n\nChun é seo a dhéanamh, is féidir leat ceann de na tascanna seo a leanas a chomhlánú:\n\n1. Tabhair cuairt ar an URL seo a leanas: {TOKENURL}\n\n2. Cóipeáil do thicéad ón ríomhphost seo, tabhair cuairt ar an URL tagartha, agus greamaigh do thicéad isteach sa fhoirm.\nURL: {FORMURL}\nTicéad: {TOKEN}\n\nTabhair faoi deara nach bhfuil an ticéad seo bailí ach don chuntas seo."
PLG_SYSTEM_PRIVACYCONSENT_EMAIL_REMIND_SUBJECT="Toiliú Príobháideachais ag {SITENAME}"
