PLG_SYSTEM_PRIVACYCONSENT_OPTION_AGREE="Aontaím"
PLG_SYSTEM_PRIVACYCONSENT_OPTION_DO_NOT_AGREE="Ní aontaím"
PLG_SYSTEM_PRIVACYCONSENT_REDIRECT_MESSAGE_DEFAULT="Deimhnigh le do thoil go dtoilíonn tú leis an suíomh gréasáin seo do chuid faisnéise a stóráil trí aontú leis an mBeartas Príobháideachais."
PLG_SYSTEM_PRIVACYCONSENT_REDIRECT_MESSAGE_DESC="Teachtaireacht saincheaptha le taispeáint ar atreorú. Má fhágtar bán é úsáidfear an teachtaireacht réamhshocraithe."
PLG_SYSTEM_PRIVACYCONSENT_REDIRECT_MESSAGE_LABEL="Teachtaireacht Atreoraithe"
PLG_SYSTEM_PRIVACYCONSENT_SUBJECT="Beartas Príobháideachais"
PLG_SYSTEM_PRIVACYCONSENT_XML_DESCRIPTION="Breiseán bunúsach chun cead úsáideora a iarraidh ar bheartas príobháideachais an tsuímh. Atreorófar úsáideoirí atá ann cheana nach bhfuil tar éis aontú fós ar logáil isteach chun a bpróifíl a nuashonrú."

