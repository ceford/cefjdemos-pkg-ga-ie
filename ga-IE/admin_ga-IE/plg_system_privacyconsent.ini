PLG_SYSTEM_PRIVACYCONSENT_LABEL="Príobháideachas Suíomh Gréasáin"
PLG_SYSTEM_PRIVACYCONSENT_NOTE_FIELD_DEFAULT="Trí chlárú leis an suíomh gréasáin seo agus glacadh leis an mBeartas Príobháideachais aontaíonn tú go stórálfaidh an suíomh gréasáin seo do chuid faisnéise."
PLG_SYSTEM_PRIVACYCONSENT_NOTE_FIELD_DESC="Achoimre ar bheartas príobháideachais an tsuímh. Má fhágtar bán é úsáidfear an teachtaireacht réamhshocraithe."
