PLG_SYSTEM_PRIVACYCONSENT="Córas - Toiliú Príobháideachais"
PLG_SYSTEM_PRIVACYCONSENT_BODY="<p>Thug an t-úsáideoir cead a gcuid faisnéise úsáideora a stóráil ag úsáid an seoladh IP <strong>%s</strong></p><p>Ba é sreangán gníomhaire úsáideora bhrabhsálaí an úsáideora:<br>%s</p><p>Taifeadadh an fhaisnéis seo go huathoibríoch nuair a chuir an t-úsáideoir a gcuid sonraí isteach ar an suíomh gréasáin agus a sheiceáil an bosca dearbhaithe.</p>"
PLG_SYSTEM_PRIVACYCONSENT_CONSENT="Thug úsáideoir <a href='{accountlink}'>{username}</a> cead don bheartas príobháideachais."
PLG_SYSTEM_PRIVACYCONSENT_FIELD_ARTICLE_DESC="Roghnaigh an t-alt ón liosta nó cruthaigh ceann nua."
PLG_SYSTEM_PRIVACYCONSENT_FIELD_ARTICLE_LABEL="Alt Príobháideachais"
