COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_DESCRIPTION="<p>Do shuíomhanna Joomla a óstáiltear taobh thiar de Chothromóirí Luchtaithe agus Próiseálaithe Droim Ar Ais, tugadh isteach socrú nua Cumraíochta Domhanda le Joomla 3.9.26</p><p>Nuair a chuirtear an socrú seo i bhfeidhm, ligfidh sé do do Chothromóir Luchtaithe/Próiseálaí Droim Ar Ais seoladh IP fíor do chuairteoirí a sholáthar. Úsáidfear an IP seo ansin i do Logaí Gníomhaíochta agus úsáidfear é chun vótáil ar ailt a rianú (má tá na gnéithe seo cumasaithe).</p><p><strong>Ní bheidh ach suíomhanna taobh thiar de Chothromóir Luchtaithe/Próiseálaí Droim Ar Ais ag iarraidh an ghné seo a chumasú.</strong></p>"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_TITLE="Socrú Freastalaí Nua \"Taobh thiar de Chothromóir Luchtaithe\""
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_DESCRIPTION="<p>Roimh 3.9.22 bhí cód mícheart sa chomhad réamhshocraithe htaccess.txt a bhí i gceist chun liostálacha eolaire a dhíchumasú. Molann an fhoireann slándála na hathruithe riachtanacha a chur i bhfeidhm de láimh ar aon chomhad .htaccess atá ann cheana, mar ní féidir an comhad seo a nuashonrú go huathoibríoch.</p><p>An sean-chód:</p><pre>&lt;IfModule autoindex&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre><p>An cód nua:</p><pre>&lt;IfModule mod_autoindex.c&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_TITLE="Nuashonrú .htaccess Maidir le Liostálacha Eolaire"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_DESCRIPTION="<p>Roimh 5.1.0 níor thacaigh an htaccess.txt réamhshocraithe le comhbhrú Brotli. D’fhéadfadh sé seo earráidí comhbhrú dúbailte a bheith mar thoradh air nuair a shuiteáiltear Joomla ar fhreastalaí a úsáideann comhbhrú Brotli. Ba cheart duit na hathruithe riachtanacha a chur i bhfeidhm de láimh ar aon chomhad .htaccess atá ann cheana, mar ní féidir an comhad seo a nuashonrú go huathoibríoch.</p><p>An sean-chód:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1]</pre><p>An cód nua:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1,E=no-brotli:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1,E=no-brotli:1]</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_TITLE="Nuashonrú .htaccess Comhbhrú Brotli"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_DESCRIPTION="<p>Roimh 4.2.9 bhí cód mícheart sa chomhad réamhshocraithe htaccess.txt chun an ceannlíne HTTP \"Content-Encoding\" a chur leis. D’fhéadfadh sé seo earráidí ionchódaithe dúbailte a bheith mar thoradh air nuair a shuiteáiltear Joomla i bhfo-eolaire agus go bhfuil comhad .htaccess leis an gcód seo sa bhun-eolaire agus sa mháthair-eolaire araon. Ba cheart duit na hathruithe riachtanacha a chur i bhfeidhm de láimh ar aon chomhad .htaccess atá ann cheana, mar ní féidir an comhad seo a nuashonrú go huathoibríoch.</p><p>An sean-chód:</p><pre>Header append Content-Encoding gzip</pre><p>An cód nua:</p><pre>Header set Content-Encoding gzip</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_TITLE="Nuashonrú .htaccess Maidir le Socrú an Cheannlíne Content-Encoding"
