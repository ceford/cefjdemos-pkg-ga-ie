JGLOBAL_FILTER_TYPE_DESC="<p>1. Ligeann an Liosta Toirmiscthe gach clib agus tréith ach amháin iad siúd atá liostaithe.<br><strong>--</strong> Clibeanna don Liosta Toirmiscthe Réamhshocraithe áirítear: 'applet', 'body', 'bgsound', 'base', 'basefont', 'canvas', 'embed', 'frame', 'frameset', 'head', 'html', 'id', 'iframe', 'ilayer', 'layer', 'link', 'meta', 'name', 'object', 'script', 'style', 'title', 'xml'<br><strong>--</strong> Tréithe don Liosta Toirmiscthe Réamhshocraithe áirítear: 'action', 'background', 'codebase', 'dynsrc', 'lowsrc', 'formaction'<br><strong>--</strong> Is féidir leat clibeanna agus tréithe breise a thoirmeasc trí chlibeanna scagaire agus tréithe scagaire a chur leis, gach ainm clibe nó tréith a scaradh le camóg.<br><strong>--</strong> Ligeann an Liosta Toirmiscthe Saincheaptha duit an Liosta Toirmiscthe Réamhshocraithe a shárú. Cuir isteach na clibeanna agus tréithe le toirmiscthe sna réimsí Clibeanna Scagaire agus Tréithe Scagaire.</p><p>Ligeann Liosta Ceadaithe ach amháin na clibeanna atá liostaithe sna réimsí Clibeanna Scagaire agus Tréithe Scagaire.</p><p>Baintear gach clib HTML as an ábhar nuair a shábháiltear é.</p><p>Tabhair faoi deara gur féidir leis na socruithe seo oibriú beag beann ar an eagarthóir a úsáideann tú. <br>Fiú má tá tú ag úsáid eagarthóir WYSIWYG, féadann na socruithe scagtha clibeanna agus tréithe breise a bhain sula sábháltar faisnéis sa bhunachar sonraí.</p>"
