COM_USERS_USER_BACKUPCODES_DESC="Mura bhfuil rochtain agat ar do ghléas Fíordheimhnithe Ilfhachtóra is féidir leat aon cheann de na pasfhocail seo a úsáid in ionad gnáthchód slándála. Scriostar gach ceann de na cóid éigeandála seo láithreach tar éis iad a úsáid. Molaimid na cóid seo a phriontáil agus an prionta a choinneáil in áit shábháilte agus inrochtana, m.sh. do sparán nó bosca taisce sábháilte."
