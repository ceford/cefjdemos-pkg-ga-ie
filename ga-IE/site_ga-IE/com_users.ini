COM_USERS_EMAIL_REGISTERED_WITH_ADMIN_ACTIVATION_BODY="Dia duit {NAME},\n\nGo raibh maith agat as clárú ag {SITENAME}. Tá do chuntas cruthaithe agus caithfear é a fhíorú sula féidir leat é a úsáid.\n\nChun an cuntas a fhíorú roghnaigh an nasc seo a leanas nó cóipeáil-ghreamaigh é i do bhrabhsálaí:\n{ACTIVATE} \n\nTar éis fíoraithe cuirfear fógra chuig riarthóir chun do chuntas a ghníomhachtú. Gheobhaidh tú dearbhú nuair a bheidh sé déanta.\n\nNuair a bheidh an cuntas sin gníomhachtaithe féadfaidh tú logáil isteach chuig {SITEURL} ag úsáid an t-ainm úsáideora agus an focal faire seo a leanas:\n\nAinm Úsáideora: {USERNAME}\nFocal Faire: {PASSWORD_CLEAR}"
COM_USERS_EMAIL_REGISTERED_WITH_ADMIN_ACTIVATION_BODY_NOPW="Dia duit {NAME},\n\nGo raibh maith agat as clárú ag {SITENAME}. Tá do chuntas cruthaithe agus caithfear é a fhíorú sula féidir leat é a úsáid.\n\nChun an cuntas a fhíorú roghnaigh an nasc seo a leanas nó cóipeáil-ghreamaigh é i do bhrabhsálaí:\n{ACTIVATE} \n\nTar éis fíoraithe cuirfear fógra chuig riarthóir chun do chuntas a ghníomhachtú. Gheobhaidh tú dearbhú nuair a bheidh sé déanta.\n\nNuair a bheidh an cuntas sin gníomhachtaithe féadfaidh tú logáil isteach chuig {SITEURL} ag úsáid an t-ainm úsáideora seo a leanas agus an focal faire a chuir tú isteach le linn clárúcháin:\n\nAinm Úsáideora: {USERNAME}"
COM_USERS_EMAIL_USERNAME_REMINDER_BODY="Dia duit,\n\nIarradh meabhrúchán ainm úsáideora do do chuntas {SITENAME}.\n\nDo ainm úsáideora: {USERNAME}\n\nChun logáil isteach i do chuntas, roghnaigh an nasc thíos.\n\n{LINK_TEXT} \n\nGo raibh maith agat."
