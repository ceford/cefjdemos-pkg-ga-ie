COM_PRIVACY_CONFIRM_REMIND_SUCCEEDED="Tá do thoiliú le Polasaí Príobháideachta an tsuímh ghréasáin seo sínte."
COM_PRIVACY_CONFIRM_REQUEST_FIELDSET_LABEL="Seoladh ríomhphost chuig do sheoladh ríomhphoist. Le do thoil, greamaigh an comhartha deimhnithe ón ríomhphost isteach sa réimse thíos chun a chruthú gur tusa úinéir na faisnéise atá á hiarraidh."
COM_PRIVACY_CONFIRM_REQUEST_SUCCEEDED="Tá d'iarratas faisnéise deimhnithe. Déanfaimid d'iarratas a phróiseáil a luaithe is féidir agus seolfar an t-easpórtáil chuig do ríomhphost."
COM_PRIVACY_CREATE_REQUEST_SUCCEEDED="Cruthaíodh d'iarratas faisnéise. Sula bhféadfar é a phróiseáil, ní mór duit an t-iarratas seo a fhíorú. Seoladh ríomhphost chuig do sheoladh le treoracha breise chun an fíorú seo a chríochnú."
COM_PRIVACY_EMAIL_REQUEST_BODY_EXPORT_REQUEST="Chruthaigh duine éigin iarratas chun gach faisnéis phearsanta a bhaineann leis an seoladh ríomhphoist seo a easpórtáil ag {URL}. Mar bheart slándála, ní mór duit a dhearbhú gur iarratas bailí é seo ar do chuid faisnéise pearsanta ón suíomh gréasáin seo.\n\nMá bhí sé seo ina bhotún, déan neamhaird den ríomhphost seo agus ní tharlóidh aon rud.\n\nChun an t-iarratas seo a dhearbhú, is féidir leat ceann de na tascanna seo a leanas a chomhlánú:\n\n1. Tabhair cuairt ar an URL seo a leanas: {TOKENURL}\n\n2. Cóipeáil do chomhartha ón ríomhphost seo, tabhair cuairt ar an URL tagartha, agus greamaigh do chomhartha isteach san fhoirm.\nURL: {FORMURL}\nComhartha: {TOKEN}\n\nTabhair faoi deara nach bhfuil an comhartha seo bailí ach ar feadh 24 uair an chloig ón am a seoladh an ríomhphost seo."
COM_PRIVACY_EMAIL_REQUEST_BODY_REMOVE_REQUEST="Chruthaigh duine éigin iarratas chun gach faisnéis phearsanta a bhaineann leis an seoladh ríomhphoist seo a bhaint ag {URL}. Mar bheart slándála, ní mór duit a dhearbhú gur iarratas bailí é seo ar do chuid faisnéise pearsanta a bhaint ón suíomh gréasáin seo.\n\nMá bhí sé seo ina bhotún, déan neamhaird den ríomhphost seo agus ní tharlóidh aon rud.\n\nChun an t-iarratas seo a dhearbhú, is féidir leat ceann de na tascanna seo a leanas a chomhlánú:\n\n1. Tabhair cuairt ar an URL seo a leanas: {TOKENURL}\n\n2. Cóipeáil do chomhartha ón ríomhphost seo, tabhair cuairt ar an URL tagartha, agus greamaigh do chomhartha isteach san fhoirm.\nURL: {FORMURL}\nComhartha: {TOKEN}\n\nTabhair faoi deara nach bhfuil an comhartha seo bailí ach ar feadh 24 uair an chloig ón am a seoladh an ríomhphost seo."
